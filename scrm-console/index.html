<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出海SCRM 控制台 · AI 智能客服工作台（可点击原型）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c12;--bg2:#0c1118;--panel:#0f1520;--panel2:#131a26;--hover:#111926;
  --line:#1a2331;--line2:#26313f;
  --txt:#e8eef8;--txt2:#9aa8bd;--txt3:#5f7089;
  --green:#22d39a;--green-d:#0fb87d;--green-bg:rgba(34,211,154,.12);
  --blue:#59a6ff;--amber:#f5a524;--red:#f2555a;--purple:#8b7bf7;
  --wa:#4ade80;--tg:#7dd3fc;
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#1f2a3a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#2b3a4e}
::-webkit-scrollbar-track{background:transparent}
input,textarea,select,button{font-family:inherit}
.app{display:grid;grid-template-columns:214px 1fr;height:100vh;min-width:1180px}

/* ---------- sidebar ---------- */
.sidebar{background:#0a0f16;border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{height:56px;display:flex;align-items:center;padding:0 16px;font-size:15px;font-weight:600;letter-spacing:.3px;border-bottom:1px solid var(--line);gap:2px;white-space:nowrap}
.brand em{font-style:normal;color:var(--green)}
.nav{padding:8px 0;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;color:var(--txt2);cursor:pointer;border-left:2px solid transparent;font-size:13px;text-decoration:none;transition:.14s}
.nav-item svg{color:#7f90a8}
.nav-item:hover{background:var(--hover);color:var(--txt)}
.nav-item.on{background:linear-gradient(90deg,rgba(34,211,154,.13),rgba(34,211,154,0));color:#fff;border-left-color:var(--green)}
.nav-item.on svg{color:var(--green)}
.n-badge{margin-left:auto;background:#e04a4f;color:#fff;font-size:10.5px;line-height:15px;padding:0 6px;border-radius:8px;font-weight:600}
.n-count{margin-left:auto;color:var(--txt3);font-size:11.5px}
.side-foot{padding:13px 16px;border-top:1px solid var(--line);color:#4b5a70;font-size:11px;line-height:1.75}
.side-foot b{color:#6c7f97;font-weight:500}

/* ---------- main / topbar ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.topbar h1{font-size:15px;font-weight:600;white-space:nowrap}
.demo-tag{font-size:10.5px;color:#7f8ea6;border:1px solid #26313f;border-radius:4px;padding:1px 6px;background:#111925}
.topbar .sub{color:var(--txt3);font-size:11.5px;white-space:nowrap}
.stats{margin-left:auto;display:flex;gap:22px;align-items:center;font-size:12px;color:var(--txt2);white-space:nowrap}
.stats b{font-size:13.5px;margin-left:6px;font-weight:700}
.stat-g{color:var(--green)}.stat-b{color:var(--blue)}.stat-y{color:var(--amber)}.stat-r{color:var(--red)}
.top-acts{margin-left:auto;display:flex;gap:10px;align-items:center}
.page{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:7px;border:1px solid transparent;font-size:12.5px;cursor:pointer;transition:.14s;white-space:nowrap;background:#161f2c;color:#c9d6e6}
.btn:hover{filter:brightness(1.12)}
.btn svg{opacity:.9}
.btn-ghost{background:#131b27;border-color:var(--line2);color:#b3c1d4}
.btn-orange{background:linear-gradient(180deg,#f0a02a,#df8509);color:#221503;font-weight:600;box-shadow:0 2px 8px rgba(232,140,20,.18)}
.btn-green{background:linear-gradient(180deg,#2ce0a6,#0fb87d);color:#03251a;font-weight:700;box-shadow:0 2px 10px rgba(34,211,154,.18)}
.btn-sm{height:26px;padding:0 10px;font-size:11.5px;border-radius:6px}
.btn-mini{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 10px;border-radius:6px;background:#1a2333;border:1px solid #2c3a52;color:#b7c6da;cursor:pointer;transition:.14s}
.btn-mini:hover{background:#22304a;color:#e6eefb}
.btn-mini.ok{background:rgba(34,211,154,.14);border-color:rgba(34,211,154,.45);color:#5eead4}
.btn-mini.warn{background:rgba(245,165,36,.12);border-color:rgba(245,165,36,.42);color:#fbbf24}

/* ---------- badges ---------- */
.ch{font-size:10.5px;padding:1px 6px;border-radius:4px;font-weight:600;line-height:16px;display:inline-block}
.ch-wa{background:rgba(37,211,102,.14);color:var(--wa)}
.ch-tg{background:rgba(56,189,248,.14);color:var(--tg)}
.ch-ig{background:rgba(236,72,153,.14);color:#f9a8d4}
.ch-em{background:rgba(148,163,184,.15);color:#cbd5e1}
.st{font-size:10.5px;padding:1px 6px;border-radius:4px;line-height:16px;display:inline-block;white-space:nowrap}
.st-ai{background:rgba(34,211,154,.13);color:#5eead4}
.st-human{background:rgba(245,165,36,.13);color:#fbbf24}
.st-low{background:rgba(242,85,90,.15);color:#f87171;white-space:normal;max-width:76px;text-align:center;line-height:1.35;padding:2px 5px}
.st-closed{background:rgba(148,163,184,.14);color:#94a3b8}
.tag{font-size:10.5px;padding:1.5px 7px;border-radius:11px;background:#16202d;border:1px solid #243044;color:#94a6bd;display:inline-block}
.tag-p{background:rgba(139,123,247,.12);border-color:rgba(139,123,247,.32);color:#c4b5fd}
.tag-g{background:rgba(34,211,154,.1);border-color:rgba(34,211,154,.3);color:#5eead4}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--green);box-shadow:0 0 0 3px rgba(34,211,154,.14)}
.dot.off{background:#5b6a80;box-shadow:0 0 0 3px rgba(91,106,128,.14)}

/* ---------- chat ---------- */
.chat-wrap{flex:1;display:grid;grid-template-columns:316px 1fr;min-height:0}
.conv-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg2)}
.conv-search{padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.search-box{display:flex;align-items:center;gap:8px;background:#121a25;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--txt3)}
.search-box input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:12.5px;min-width:0}
.search-box input::placeholder{color:#4f5f76}
.conv-items{flex:1;overflow-y:auto;min-height:0}
.conv-item{padding:11px 13px;border-bottom:1px solid rgba(26,35,49,.9);cursor:pointer;border-left:2px solid transparent;transition:.12s}
.conv-item:hover{background:#0f1723}
.conv-item.on{background:#131c2a;border-left-color:var(--green)}
.conv-top{display:flex;align-items:center;gap:6px}
.conv-top .st{margin-left:auto}
.conv-name{font-weight:600;font-size:13px;color:#eaf1fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
.conv-msg{color:var(--txt2);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-meta{color:var(--txt3);font-size:11px;margin-top:4px;display:flex;gap:8px;align-items:center}
.conv-empty{padding:30px 16px;text-align:center;color:var(--txt3);font-size:12px}
.conv-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#080d13}
.conv-head{padding:11px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2);flex:none}
.conv-head .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conv-head .name{font-size:15px;font-weight:600}
.conv-head .meta{color:var(--txt3);font-size:11.5px;margin-top:5px}
.conv-head .acts{margin-left:auto;display:flex;gap:9px}
.conv-body{flex:1;overflow-y:auto;padding:20px 24px 8px;min-height:0}
.msg{display:flex;gap:10px;margin-bottom:13px}
.msg .av{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.3px}
.av-cust{background:#22303f;color:#9fb4cd}
.av-ai{background:linear-gradient(135deg,#8b7bf7,#6653e0);color:#fff}
.av-agent{background:linear-gradient(135deg,#2ce0a6,#0f9f74);color:#04241a}
.bubble{background:#141d29;border:1px solid #1f2b3b;padding:9px 13px;border-radius:9px;max-width:640px;font-size:13px;line-height:1.6;color:#dde7f3;word-break:break-word}
.msg .time{color:#4d5d73;font-size:10.5px;margin-top:4px}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:rgba(34,211,154,.1);border-color:rgba(34,211,154,.32);color:#dffaef}
.msg.me .av{order:2}
.msg.me .col{display:flex;flex-direction:column;align-items:flex-end}
.msg .col{display:flex;flex-direction:column;min-width:0}
.msg-tag{font-size:10px;color:#5eead4;margin-bottom:4px;display:flex;gap:4px;align-items:center}
.sys-line{text-align:center;color:#66788f;font-size:11px;margin:10px 0 14px;display:flex;align-items:center;gap:8px;justify-content:center}
.sys-line::before,.sys-line::after{content:'';height:1px;background:#1a2331;width:48px}
.typing{background:#141d29;border:1px solid #1f2b3b;border-radius:9px;padding:10px 13px;color:#7f90a8;font-size:12px}
.ai-card{border:1px solid rgba(139,123,247,.45);border-radius:11px;background:linear-gradient(180deg,rgba(139,123,247,.11),rgba(139,123,247,.03));padding:11px 13px;max-width:800px;margin:0 0 14px 36px;box-shadow:0 4px 18px rgba(60,40,140,.12)}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.ai-name{color:#c4b5fd;font-size:11.5px;font-weight:600}
.ai-head .right{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt2)}
.conf{width:70px;height:5px;border-radius:3px;background:#2a2f45;overflow:hidden}
.conf i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#22d39a,#5eead4)}
.conf.mid i{background:linear-gradient(90deg,#f5a524,#fbbf24)}
.conf.low i{background:linear-gradient(90deg,#f2555a,#f87171)}
.conf-score{font-weight:600}
.ai-body{background:rgba(139,123,247,.07);border-radius:7px;padding:9px 12px;font-size:12.8px;line-height:1.62;color:#e4e9f5;word-break:break-word}
.ai-src{margin-top:9px;font-size:11px;color:#8f9cb5;display:flex;gap:5px;align-items:flex-start}
.ai-actions{display:flex;gap:8px;margin-top:10px}
.composer{padding:11px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg2);flex:none}
.switch{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt2);white-space:nowrap;cursor:pointer;user-select:none}
.sw{width:30px;height:16px;border-radius:9px;background:#28344a;position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#8fa1b8;top:2px;left:2px;transition:.2s}
.sw.on{background:rgba(34,211,154,.34)}
.sw.on::after{left:16px;background:#22d39a}
.input-wrap{flex:1;display:flex;align-items:center;background:#121a25;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;gap:8px;min-width:0}
.input-wrap:focus-within{border-color:rgba(34,211,154,.45)}
.input-wrap input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:12.8px;min-width:0}
.input-wrap input::placeholder{color:#4f5f76}
.send-btn{height:34px;padding:0 18px;border-radius:7px;border:0;background:linear-gradient(180deg,#2ce0a6,#0fb87d);color:#03251a;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.send-btn:hover{filter:brightness(1.08)}

/* ---------- generic page ---------- */
.pad{padding:16px 18px 24px;overflow-y:auto;flex:1;min-height:0}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.kpi-row.c3{grid-template-columns:repeat(3,1fr)}
.kpi-row.c5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.kpi .k{color:var(--txt3);font-size:11.5px;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:21px;font-weight:700;margin-top:7px;letter-spacing:.4px}
.kpi .d{font-size:11px;margin-top:5px;color:var(--txt3)}
.up{color:var(--green)}.down{color:var(--red)}
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .search-box{min-width:230px}
select.inp,input.inp,textarea.inp{background:#121a25;border:1px solid var(--line2);border-radius:7px;color:var(--txt);font-size:12.5px;padding:7px 10px;outline:0;height:32px}
select.inp{color:#c2d0e2;cursor:pointer}
textarea.inp{height:auto;min-height:96px;resize:vertical;line-height:1.6;width:100%}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:rgba(34,211,154,.45)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#0c1219;max-height:calc(100vh - 268px)}
table{width:100%;border-collapse:collapse;font-size:12.3px}
thead th{text-align:left;color:var(--txt3);font-weight:500;padding:10px 12px;background:#0e151f;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(26,35,49,.7);color:#cfdaea;vertical-align:middle}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:#111a26}
tbody tr:last-child td{border-bottom:0}
.cell-main{display:flex;align-items:center;gap:9px;min-width:0}
.avatar{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#cfe0f3;background:#22303f}
.avatar.b{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff}
.avatar.g{background:linear-gradient(135deg,#22d39a,#0f9f74);color:#04241a}
.avatar.p{background:linear-gradient(135deg,#8b7bf7,#6653e0);color:#fff}
.muted{color:var(--txt3)}
.right{text-align:right}
.nowrap{white-space:nowrap}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sec-title{font-size:12.5px;font-weight:600;color:#cfdaea;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-title .hint{font-weight:400;color:var(--txt3);font-size:11px}
.legend{display:flex;flex-direction:column;gap:10px;font-size:12px}
.legend .row{display:flex;align-items:center;gap:8px;color:var(--txt2)}
.legend .sq{width:8px;height:8px;border-radius:2px;flex:none}
.legend .num{margin-left:auto;color:#dbe6f4;font-weight:600}
.hbar{margin-bottom:11px}
.hbar .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt2);margin-bottom:5px}
.hbar .track{height:6px;border-radius:4px;background:#182231;overflow:hidden}
.hbar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#22d39a,#38e0b4)}
.hbar .fill.b{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.hbar .fill.p{background:linear-gradient(90deg,#8b7bf7,#a78bfa)}
.hbar .fill.y{background:linear-gradient(90deg,#f5a524,#fbbf24)}
.hbar .fill.r{background:linear-gradient(90deg,#f2555a,#f87171)}
.ch-list{display:flex;flex-direction:column;gap:9px}
.ch-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#0d141d;cursor:pointer}
.ch-row:hover{border-color:#2a3a52;background:#101926}
.ch-row .nm{font-size:12.5px;color:#dbe6f4}
.ch-row .sub{font-size:11px;color:var(--txt3);margin-top:2px}
.ch-row .go{margin-left:auto;color:#5f7089;font-size:11.5px;display:flex;align-items:center;gap:4px}
.camp{display:flex;flex-direction:column;gap:10px}
.camp-row{display:grid;grid-template-columns:1.6fr repeat(4,1fr) 90px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;background:#0d141d;padding:12px 14px}
.camp-row:hover{border-color:#2a3a52;background:#101926}
.camp-title{font-size:13px;font-weight:600;color:#e4ecf7}
.camp-sub{font-size:11px;color:var(--txt3);margin-top:5px;display:flex;gap:7px;align-items:center}
.camp-num{font-size:14px;font-weight:600;color:#dbe6f4}
.camp-lab{font-size:10.5px;color:var(--txt3);margin-bottom:3px}
.chan-card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:14px}
.chan-top{display:flex;align-items:center;gap:10px}
.chan-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#141e2b;border:1px solid #22303f}
.chan-nm{font-size:13px;font-weight:600}
.chan-sub{font-size:11px;color:var(--txt3);margin-top:3px}
.chan-stats{display:flex;gap:18px;margin:13px 0 4px}
.chan-stat .n{font-size:16px;font-weight:700}
.chan-stat .l{font-size:10.5px;color:var(--txt3)}
.chan-foot{display:flex;gap:8px;margin-top:10px;padding-top:11px;border-top:1px solid var(--line);align-items:center}
.kb-wrap{display:grid;grid-template-columns:172px 1fr;gap:14px;flex:1;min-height:0}
.kb-cats{display:flex;flex-direction:column;gap:3px}
.kb-cat{padding:8px 11px;border-radius:7px;font-size:12.3px;color:var(--txt2);cursor:pointer;display:flex;justify-content:space-between}
.kb-cat:hover{background:#101926;color:var(--txt)}
.kb-cat.on{background:rgba(34,211,154,.1);color:#5eead4}
.kb-cat .c{font-size:11px;color:var(--txt3)}
.kb-main{display:flex;flex-direction:column;min-height:0}
.steps{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--txt3)}
.step{display:flex;align-items:center;gap:6px}
.step .n{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#1a2433;color:#93a4bb;font-size:10px}
.step.on .n{background:var(--green);color:#04241a;font-weight:700}

/* ---------- drawer / modal / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(2,5,9,.62);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:452px;background:#0c131c;border-left:1px solid var(--line2);z-index:70;transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(0,0,0,.4)}
.drawer.on{transform:none}
.drawer-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.drawer-h .t{font-size:14px;font-weight:600}
.drawer-h .x{margin-left:auto;cursor:pointer;color:#6f8098;display:grid;place-items:center;width:26px;height:26px;border-radius:6px}
.drawer-h .x:hover{background:#182231;color:#cbd8e8}
.drawer-b{flex:1;overflow-y:auto;padding:15px 18px;min-height:0}
.drawer-f{padding:11px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.97);width:520px;max-height:84vh;background:#0d141e;border:1px solid var(--line2);border-radius:13px;z-index:70;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.modal-b{padding:16px 18px;overflow-y:auto;flex:1;min-height:0}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--txt2);margin-bottom:6px}
.field .inp{width:100%}

function scrollConvBottom() {
  const b = $('#convBody');
  if (b) b.scrollTop = b.scrollHeight;
}
function renderChatPage() {
  if (S.page !== 'inbox') return;
  $('#page').innerHTML = renderChat();
  renderNav(); renderTopbar();
  scrollConvBottom();
}

function pickCustomer(id) {
  S.cid = id;
  const c = cur(); c.unread = 0;
  if (S.page !== 'inbox') { go('inbox'); return; }
  $('#page').innerHTML = renderChat();
  scrollConvBottom();
}

function adopt() {
  const c = cur(), d = c.draft;
  if (!d) return;
  c.msgs.push({ r: 'agent', t: d.text, time: nowTime(), tag: `已采纳 AI 草稿 · 置信度 ${d.conf} 分` });
  c.draft = null;
  c.last = d.text.slice(0, 42);
  c.time = nowTime();
  renderChatPage();
  toast('已采纳并发送给客户');
  if (c.queue) {
    const cid = c.id;
    setTimeout(() => {
      const cc = CUSTOMERS.find(x => x.id === cid);
      cc.msgs.push({ r: 'cust', t: cc.queue, time: nowTime() });
      cc.last = cc.queue; cc.time = nowTime();
      if (S.cid === cid) renderChatPage(); else renderTopbar();
    }, 900);
  }
}

function editDraft() {
  const c = cur();
  if (!c.draft) return;
  const inp = $('#msgInput');
  if (inp) { inp.value = c.draft.text; inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  toast('草稿已填入输入框，可编辑后发送');
}

function transfer() {
  const c = cur();
  if (c.status === 'human' && c.handoff) { toast('当前已在人工接待中，转接面板已生成'); return; }
  const isReturn = /退货|возврат|return/i.test(String(c.last) + ' ' + String((c.msgs[0] || {}).t || ''));
  c.status = 'human';
  c.draft = null;
  c.owner = '客服 Kristin';
  c.handoff = {
    tag: `${isReturn ? '退换货' : '常规咨询'}-${c.country}区`,
    agent: '您好，我是人工客服小李，已查看您与 AI 的对话记录。…（无缝接续，无需客户重复描述）'
  };
  renderChatPage();
  toast('已转人工 · 人机协作转接面板已生成');
}

function backAI() {
  const c = cur();
  c.status = 'ai';
  c.handoff = null;
  c.msgs.push({ r: 'sys', t: '已转回 AI 接待模式', time: nowTime() });
  renderChatPage();
  toast('已转回 AI 接待');
}

function sendMsg() {
  const inp = $('#msgInput');
  if (!inp) return;
  const v = inp.value.trim();
  if (!v) { toast('请输入消息内容'); inp.focus(); return; }
  const c = cur();
  const isDraft = !!(c.draft && v === c.draft.text.trim());
  c.msgs.push({ r: 'agent', t: v, time: nowTime(), tag: isDraft ? 'AI 辅助草稿 · 人工确认后发送' : '' });
  if (isDraft) c.draft = null;
  c.last = v.slice(0, 42);
  c.time = nowTime();
  inp.value = '';
  if (S.aiFirst && c.status === 'ai') {
    c.typing = true;
    renderChatPage();
    const cid = c.id;
    setTimeout(() => {
      const cc = CUSTOMERS.find(x => x.id === cid);
      cc.typing = false;
      cc.msgs.push({ r: 'cust', t: cc.queue || 'Thanks!', time: nowTime() });
      cc.last = cc.queue || 'Thanks!'; cc.time = nowTime(); cc.unread = S.cid === cid ? 0 : 1;
      cc.draft = { conf: 82 + Math.round(Math.random() * 13), auto: true, src: '《FAQ-通用应答》第1.2条', text: cc.aiReply };
      if (S.cid === cid) renderChatPage(); else { renderNav(); }
    }, 1400);
  } else {
    renderChatPage();
  }
}

/* ========== 5. 数据看板 ========== */
function lineChart(vals, labels, color) {
  const w = 620, h = 190, padL = 30, padR = 12, padT = 16, padB = 28;
  const max = Math.max.apply(null, vals) * 1.18;
  const x = i => padL + i * ((w - padL - padR) / (vals.length - 1));
  const y = v => padT + (1 - v / max) * (h - padT - padB);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${x(vals.length - 1).toFixed(1)},${h - padB} L${padL},${h - padB} Z`;
  const grid = [0, .25, .5, .75, 1].map(t => {
    const yy = (padT + t * (h - padT - padB)).toFixed(1);
    return `<line x1="${padL}" y1="${yy}" x2="${w - padR}" y2="${yy}" stroke="#18222f" stroke-dasharray="3 4"/>`;
  }).join('');
  const lbls = labels.map((l, i) => `<text x="${x(i).toFixed(1)}" y="${h - 9}" fill="#5f7089" font-size="10" text-anchor="middle">${l}</text>`).join('');
  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="#0b1118" stroke="${color}" stroke-width="2"/>`).join('');
  const nums = pts.map((p, i) => `<text x="${p[0].toFixed(1)}" y="${(p[1] - 9).toFixed(1)}" fill="#8fa0b8" font-size="9.5" text-anchor="middle">${vals[i]}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:196px">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g1)"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${nums}${lbls}
  </svg>`;
}

function donut(segs) {
  const R = 54, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = segs.map(s => {
    const len = C * s.v / 100;
    const el = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.c}" stroke-width="15"
      stroke-dasharray="${len.toFixed(1)} ${(C - len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 70 70)"/>`;
    off += len;
    return el;
  }).join('');
  return `<div style="display:flex;gap:18px;align-items:center">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px;flex:none">${arcs}
      <text x="70" y="66" fill="#e8eef8" font-size="17" font-weight="700" text-anchor="middle">1,884</text>
      <text x="70" y="84" fill="#5f7089" font-size="9.5" text-anchor="middle">今日消息</text>
    </svg>
    <div class="legend" style="flex:1">${segs.map(s => `<div class="row"><span class="sq" style="background:${s.c}"></span><span>${s.n}</span><span class="num">${s.v}%</span></div>`).join('')}</div>
  </div>`;
}

  const t = $('#toast');

}

/* ========== 提交动作 ========== */
function submitCustomer() {
  const name = ($('#ncName') && $('#ncName').value.trim()) || '';
  if (!name) { toast('请填写客户姓名'); return; }
  const ch = $('#ncCh').value, country = ($('#ncCountry').value.trim() || '未知'), lang = ($('#ncLang').value.trim() || '英语');
  const rfm = $('#ncRfm').value;
  const tags = ($('#ncTags').value || '新客户').split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const id = 'c' + (CUSTOMERS.length + 1);
  CUSTOMERS.unshift({
    id, name, channel: ch, country, lang, status: 'ai', rfm, repurchase: 0, spend: 0,
    lastOrder: '暂无成交', owner: 'AI 自动接待', tags, last: '（新客户，暂无消息）', time: nowTime(), unread: 0,
    msgs: [], draft: { conf: 85, auto: true, src: '《FAQ-通用应答》第1.1条', text: `Hi ${name}! Thanks for reaching out — how can I help you today?` },
    queue: 'Thanks!', aiReply: 'Happy to help! Could you tell me a bit more about what you need?'
  });
  closeOverlay(); renderTopbar(); route(); toast('客户已创建并进入待接入队列');
}
function submitCampaign() {
  const name = ($('#caName').value.trim());
  if (!name) { toast('请填写活动名称'); return; }
  CAMPAIGNS.unshift({ name, channel: $('#caCh').value, status: '待发送', audience: $('#caAud').value, sent: 0, open: 0, click: 0, conv: 0, time: ($('#caTime').value || '未排期') });
  closeOverlay(); route(); toast('群发活动已创建，等待到点发送');
}
function submitKb() {
  const title = ($('#kbTitle').value.trim()) || '';
  if (!title) { toast('请填写文档标题'); return; }
  DOCS.unshift({ title, cat: $('#kbCat').value, hits: 0, up: '刚刚', status: $('#kbStatus').value, body: $('#kbBody').value.trim() || '（空文档）' });
  closeOverlay(); route(); toast('文档已保存，向量化任务已提交');
}
function submitNewChannel() {
  const type = $('#chType').value;
  const acc = ($('#chAcc').value.trim()) || '未填写账号';
  CHANNELS.push({ name: type, key: type, icon: 'plug', on: true, accounts: 1, msgs: 0, account: acc, api: '默认配置', webhook: '已订阅' });
  closeOverlay(); route(); toast('渠道已连接，开始同步历史消息');
}

/* ========== 事件委托 ========== */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch (act) {
    case 'nav': go(a.dataset.page); break;
    case 'pick': pickCustomer(id); break;
    case 'cust': closeOverlay(); S.cid = id; go('inbox'); break;
    case 'adopt': adopt(); break;
    case 'edit-draft': editDraft(); break;
    case 'transfer': transfer(); break;
    case 'back-ai': backAI(); break;
    case 'send': sendMsg(); break;
    case 'toggle-ai': S.aiFirst = !S.aiFirst; renderChatPage(); toast(S.aiFirst ? '已开启 AI 优先接待' : '已关闭 AI 优先接待'); break;
    case 'close-overlay': closeOverlay(); break;
    case 'drawer-cust': openCustomerDrawer(id); break;
    case 'drawer-camp': openCampaignDrawer(+a.dataset.i); break;
    case 'drawer-kb': openKbDrawer(+a.dataset.i); break;
    case 'drawer-chan': openChannelDrawer(+a.dataset.i); break;
    case 'modal-cust': openCustomerModal(); break;
    case 'modal-camp': openCampaignModal(); break;
    case 'modal-kb': openKbModal(); break;
    case 'modal-chan': openChannelModal(); break;
    case 'save-cust': submitCustomer(); break;
    case 'save-camp': submitCampaign(); break;
    case 'save-kb': submitKb(); break;
    case 'save-chan': closeOverlay(); toast('渠道配置已保存'); break;
    case 'save-chan-new': submitNewChannel(); break;
    case 'chan-toggle': {
      const ch = CHANNELS[+a.dataset.i];
      ch.on = !ch.on;
      if (ch.on) { ch.accounts = 1; ch.account = ch.account === '未绑定' ? '待同步' : ch.account; }
      route(); toast(ch.on ? `已连接 ${ch.name}` : `已断开 ${ch.name}`);
      break;
    }
    case 'kb-cat': S.kbCat = a.dataset.cat; route(); break;
    case 'inbox-channel': S.inboxCh = a.dataset.c; route(); break;
    case 'read-all': CUSTOMERS.forEach(c => c.unread = 0); route(); toast('已全部标记为已读'); break;
    case 'export-dash': toast('报表已导出：AI客服周报_1011-1017.xlsx（演示）'); break;
    case 'export-cust': toast('客户列表已导出：客户池_20261017.csv（演示）'); break;
    case 'tag-cust': toast('演示：打开标签选择器'); break;
    case 'copy-camp': toast('活动已复制为草稿'); break;
    case 'copy-kb': toast('文档内容已复制'); break;
    case 'cfg-open': go('chat'); break;
    case 'cfg-back': go('inbox'); break;
    case 'cfg-chip': CFG[a.dataset.g] = a.dataset.v; renderCfgPage(); break;
    case 'cfg-seg': CFG[a.dataset.g] = a.dataset.v; renderCfgPage(); break;
    case 'cfg-model': CFG.model = a.dataset.v; renderCfgPage(); break;
    case 'cfg-sw': cfgToggle(a.dataset.k); renderCfgPage(); break;
    case 'cfg-kw-add': addCfgKw(); break;
    case 'cfg-kw-del': CFG.keywords = CFG.keywords.filter(k => k !== a.dataset.v); renderCfgPage(); break;
    case 'cfg-kb-new': openCfgKbModal(); break;
    case 'cfg-kb-save': submitCfgKb(); break;
    case 'cfg-save': toast('配置已保存并生效（演示，仅当前浏览器会话有效）'); break;
    case 'noop': break;
    default: break;
  }
});

document.addEventListener('input', e => {
  const tg = e.target;
  if (tg.id === 'cfgName') CFG.name = tg.value;
  else if (tg.id === 'cfgPrompt') CFG.sysPrompt = tg.value;
  else if (tg.id === 'cfgFallback') CFG.fallback = tg.value;
  else if (tg.id === 'cfgWs') CFG.workStart = tg.value;
  else if (tg.id === 'cfgWe') CFG.workEnd = tg.value;
  else if (tg.id === 'cfgPeak') CFG.peakMins = tg.value;
  else if (tg.id === 'cfgStreak') CFG.dropStreak = tg.value;
  else if (tg.id === 'cfgDrop') CFG.dropConf = tg.value;
  else if (tg.dataset && tg.dataset.range) {
    CFG[tg.dataset.range] = +tg.value;
    const map = { weight: 'rvWeight', wModel: 'rvModel', wKb: 'rvKb', wHist: 'rvHist' };
    const lab = $('#' + map[tg.dataset.range]);
    if (lab) lab.textContent = tg.value + '%';
    const total = CFG.wModel + CFG.wKb + CFG.wHist;
    const h = $('#wHint');
    if (h) {
      const ok = total === 100;
      h.className = 'mini-hint ' + (ok ? 'ok' : 'err');
      h.textContent = ok ? '权重合计 100%，配置有效' : `权重合计 ${total}%（建议调整为 100%）`;
    }
  } else if (tg.dataset && tg.dataset.band) {
    CFG.bands[tg.dataset.band] = +tg.value || 0;
    const b = CFG.bands;
    const ok = b.highLo > b.midHi && b.midLo > b.lowHi;
    const h = $('#bandHint');
    if (h) {
      h.className = 'mini-hint ' + (ok ? 'ok' : 'err');
      h.textContent = ok ? '✅ 区间边界实时校验，防止出现分数空档或重叠；调整后仅对新会话生效' : '⚠️ 区间存在重叠或空档，请调整边界';
    }
  }
  if (e.target.id === 'convQ') {
    const box = $('#convItems');
    if (box) box.innerHTML = convItemsHTML(e.target.value);
  }
  if (e.target.id === 'custQ') {
    S.custQ = e.target.value;
    const wrap = $('#page');
    const key = S.custQ.toLowerCase();
    const list = CUSTOMERS.filter(c => !key || (c.name + c.country + c.lang + c.rfm).toLowerCase().indexOf(key) >= 0);
    const tbody = wrap.querySelector('tbody');
    if (tbody) tbody.innerHTML = list.map(c => `<tr data-act="drawer-cust" data-id="${c.id}">
      <td><div class="cell-main"><span class="avatar ${c.status === 'human' ? 'b' : c.status === 'low' ? 'p' : 'g'}">${initials(c.name)}</span><div><div>${esc(c.name)}</div><div class="muted" style="font-size:11px">${c.tags.slice(0, 2).join(' · ')}</div></div></div></td>
      <td><span class="ch ${chCls(c.channel)}">${c.channel}</span></td>
      <td class="muted">${c.country} · ${c.lang}</td><td>${c.repurchase} 次</td><td>$${c.spend.toLocaleString()}</td>
      <td><span class="tag ${rfmCls(c.rfm)}">${c.rfm}</span></td><td class="muted nowrap">${c.lastOrder}</td><td class="muted nowrap">${c.time}</td>
      <td class="right"><button class="btn-mini" data-act="cust" data-id="${c.id}">${ic('chat', 12)}会话</button></td></tr>`).join('');
  }
  if (e.target.id === 'kbQ') {
    S.kbQ = e.target.value;
    route();
    const inp = $('#kbQ');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
});

document.addEventListener('keydown', e => {
  if (e.target.id === 'kwInput' && e.key === 'Enter') { e.preventDefault(); addCfgKw(); }
  if (e.target.id === 'msgInput' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  if (e.target.id === 'msgInput') e.target.dataset.draft = '';
  if (e.key === 'Escape') closeOverlay();
});

$('#mask').addEventListener('click', closeOverlay);
window.addEventListener('hashchange', route);

/* ========== 启动 ========== */
renderNav();
route();

</script>
</body>
</html>
