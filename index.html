<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校园防霸凌系统 · 1.0 可点击原型</title>
<style>
:root{
  --bg:#f5f8f6; --card:#fff; --ink:#243b33; --mut:#6d8379; --line:#e4ece7;
  --primary:#2f9e6e; --primary-2:#27855c; --primary-bg:#e6f4ec;
  --danger:#d65c4a; --warn:#e07b39; --ok:#2f9e6e; --amber:#d9a13b;
  --l1:#d9a13b; --l2:#e07b39; --l3:#d65c4a;
  --radius:10px; --shadow:0 2px 10px rgba(36,59,51,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

/* ---------- 登录页 ---------- */
.login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#e9f4ee 0%,#f2f7f3 60%,#f7faf8 100%)}
.login-card{width:880px;max-width:94vw;background:var(--card);border-radius:16px;display:flex;overflow:hidden;box-shadow:0 14px 44px rgba(36,59,51,.14);border:1px solid var(--line)}
.login-brand{width:44%;background:#eef7f1;padding:36px 28px;display:flex;flex-direction:column;gap:14px}
.login-brand .logo{font-size:20px;font-weight:700;color:var(--primary)}
.login-brand .tag{font-size:13px;color:var(--mut);line-height:1.7}
.login-brand .rule{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:12.5px;color:var(--mut);line-height:1.8}
.login-form{flex:1;padding:40px 36px}
.login-form h1{font-size:20px;margin-bottom:4px}
.login-form .sub{color:var(--mut);font-size:13px;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.field input:focus,.field select:focus{outline:2px solid var(--primary-bg);border-color:var(--primary)}
.role-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--mut);background:#fff}
.chip.on{border-color:var(--primary);color:var(--primary);background:var(--primary-bg);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);font-weight:600;font-size:13px;transition:filter .12s}
.btn:hover{filter:brightness(.97)}
.btn:active{filter:brightness(.93)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

/* ---------- 主框架 ---------- */
.app-view{display:flex;height:100vh;overflow:hidden}
.sidebar{width:208px;flex:none;background:#fff;border-right:1px solid var(--line);color:var(--mut);display:flex;flex-direction:column}
.sidebar .logo{padding:16px 18px;font-size:15px;font-weight:700;color:var(--primary);border-bottom:1px solid var(--line);letter-spacing:.5px}
.sidebar nav{flex:1;padding:10px 8px;overflow:auto}
.sidebar nav a{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:#5b7268;text-decoration:none;font-size:13.5px;margin-bottom:2px}
.sidebar nav a:hover{background:#f0f7f3;color:var(--primary)}
.sidebar nav a.on{background:var(--primary-bg);color:var(--primary);font-weight:600}
.sidebar .foot{padding:12px 16px;font-size:11.5px;color:#9db2a8;border-top:1px solid var(--line)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
.topbar .crumb{font-size:15px;font-weight:700}
.topbar .sp{flex:1}
.bell{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.rolebox{display:flex;align-items:center;gap:8px}
.rolebox .who{text-align:right;line-height:1.25}
.rolebox .who b{font-size:13px;display:block}
.rolebox .who span{font-size:11.5px;color:var(--mut)}
.rolebox select{padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:12.5px}
#content{flex:1;overflow:auto;padding:18px}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
.card .hd{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.card .hd .sp{flex:1}
.card .bd{padding:16px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.stat .k{font-size:12.5px;color:var(--mut)}
.stat .v{font-size:24px;font-weight:700;margin-top:3px}
.stat .v small{font-size:13px;color:var(--mut);font-weight:400}
.stat .sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{background:#f2f7f4;text-align:left;padding:9px 12px;color:var(--mut);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:9px 12px;border-bottom:1px solid #eef4f0;vertical-align:middle}
table.list tr:hover td{background:#f6faf7}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-l1{background:#faf3e2;color:#c98a2e} .b-l2{background:#fdeee4;color:#d4682f} .b-l3{background:#fbe7e2;color:#c94f3c}
.b-pending{background:#fbe7e2;color:#c94f3c} .b-handling{background:#fdeee4;color:#d4682f}
.b-confirm{background:#e6f4ec;color:#27855c} .b-review{background:#e9f0fb;color:#5b7fd4}
.b-archived{background:#edf2ef;color:#8ba096} .b-up{background:#fbe7e2;color:#c0392b}
.b-on{background:#e6f4ec;color:#27855c} .b-off{background:#edf2ef;color:#8ba096} .b-alarm{background:#fbe7e2;color:#c94f3c} .b-fault{background:#fdeee4;color:#c98a2e}
.b-skip{background:#edf2ef;color:#8ba096}
.row-hot{background:#fff5f5!important}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters select,.filters input{padding:6px 9px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:12.5px}
.filters .sp{flex:1}
.tag{display:inline-block;background:#eef1f6;color:var(--mut);border-radius:4px;padding:1px 6px;font-size:11.5px;margin-left:4px}
.empty{padding:40px;text-align:center;color:var(--mut);font-size:13px}

/* 步骤条 */
.steps{display:flex;align-items:flex-start;padding:6px 0 4px}
.step{flex:1;position:relative;text-align:center}
.step::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step .c{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mut);position:relative;z-index:1}
.step.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .c{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-bg)}
.step.skip .c{background:#eef1f6;border-color:#d8dfe8;color:#9aa7b8}
.step.done::before,.step.cur::before{background:var(--ok)}
.step .t{font-size:12px;color:var(--mut);margin-top:6px}
.step.cur .t{color:var(--ink);font-weight:700}
.step.done .t{color:var(--ok)}
.step.skip .t{color:#9aa7b8}

/* 详情 */
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px}
.kv .it .k{font-size:12px;color:var(--mut)}
.kv .it .v{font-size:13.5px;font-weight:600;margin-top:1px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding-bottom:14px}
.tl .it::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.tl .it .who{font-size:13px;font-weight:600}
.tl .it .when{font-size:11.5px;color:var(--mut)}
.tl .it .note{font-size:12.5px;color:var(--mut);margin-top:2px}

/* 轨迹回放 */
.replay-wrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);overflow:hidden}
.replay-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.replay-head .sp{flex:1}
.replay svg{display:block;width:100%;height:150px}
.replay .playbar{height:6px;background:var(--line);position:relative}
.replay .playbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--primary);width:0%}

/* 模态 */
.modal-mask{position:fixed;inset:0;background:rgba(36,59,51,.42);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{width:480px;max-width:92vw;background:var(--card);border-radius:8px;box-shadow:0 16px 50px rgba(9,20,40,.3)}
.modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px}
.modal .bd{padding:16px 18px}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* toast */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#243b33;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(36,59,51,.3);animation:tin .18s ease}
.toast.ok{background:var(--ok)} .toast.err{background:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}

/* 通知面板 */
.notif-panel{position:absolute;top:44px;right:0;width:340px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 34px rgba(9,20,40,.16);overflow:hidden;z-index:40}
.notif-panel .hd{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.notif-panel .it{padding:10px 14px;border-bottom:1px solid #f0f2f6;font-size:12.5px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.notif-panel .it:hover{background:#f7f9fc}
.notif-panel .it .t{font-weight:600}
.notif-panel .it .m{color:var(--mut);font-size:12px;margin-top:1px}

/* 地图 */
.campus{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.campus svg{width:100%;height:auto;display:block}
.devdot{cursor:pointer}
.devpop{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(9,20,40,.18);padding:12px 14px;width:230px;font-size:12.5px;z-index:30}
.devpop .nm{font-weight:700;font-size:13.5px;margin-bottom:4px}
.devpop .row{display:flex;justify-content:space-between;padding:2px 0;color:var(--mut)}
.devpop .row b{color:var(--ink)}

/* 排班日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{border:1px solid var(--line);border-radius:var(--radius);min-height:76px;padding:6px;background:#fff;font-size:12px}
.cal .d .dn{color:var(--mut);font-size:11.5px}
.cal .d .sh{display:block;margin-top:3px;padding:2px 5px;border-radius:4px;background:var(--primary-bg);color:var(--primary);font-size:11px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 14px;background:#fff}
.tabs button{padding:10px 16px;border:none;background:none;font-weight:600;font-size:13.5px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}

/* 权限树 */
.ptree{font-size:13px}
.ptree .grp{font-weight:700;margin:10px 0 4px}
.ptree label{display:flex;align-items:center;gap:7px;padding:3px 0;font-weight:400;color:#33415c}
.ptree input{accent-color:var(--primary)}

.demo-note{font-size:11.5px;color:var(--mut);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
/* ============ 主题：暗夜指挥舱 ============ */
[data-theme="dark"]{
  --bg:#0e1620; --card:#151f2b; --ink:#e6edf3; --mut:#8b9bb0; --line:#253349;
  --primary:#38bdf8; --primary-2:#0ea5e9; --primary-bg:#0f2a3d;
  --danger:#f87171; --warn:#fb923c; --ok:#34d399; --amber:#fbbf24;
  --l1:#fbbf24; --l2:#fb923c; --l3:#f87171;
  --radius:8px; --shadow:0 2px 14px rgba(0,0,0,.35);
}
[data-theme="dark"] body{background:var(--bg)}
[data-theme="dark"] .sidebar{background:#0a1119;border-right:1px solid var(--line)}
[data-theme="dark"] .sidebar .logo{color:var(--primary);border-bottom-color:var(--line)}
[data-theme="dark"] .sidebar nav a{color:#7d93ad}
[data-theme="dark"] .sidebar nav a:hover{background:#12202e;color:#fff}
[data-theme="dark"] .sidebar nav a.on{background:var(--primary-bg);color:var(--primary)}
[data-theme="dark"] .sidebar .foot{color:#4c5f76;border-top-color:var(--line)}
[data-theme="dark"] .topbar{background:var(--card);border-bottom-color:var(--line)}
[data-theme="dark"] .login-view{background:linear-gradient(160deg,#0a1119 0%,#0e1620 55%,#0f1c2a 100%)}
[data-theme="dark"] .login-card{border-color:var(--line);box-shadow:0 14px 50px rgba(0,0,0,.55)}
[data-theme="dark"] .login-brand{background:#0f1a26}
[data-theme="dark"] .login-brand .rule{background:#131e2b}
[data-theme="dark"] .filters input,.filters select,.field input,.field select,.field textarea{background:#0e1620;color:var(--ink)}
[data-theme="dark"] .bell{background:var(--bg)}
[data-theme="dark"] .rolebox select{background:#0e1620;color:var(--ink)}
[data-theme="dark"] table.list th{background:#101a26}
[data-theme="dark"] table.list td{border-bottom-color:#1d2a3b}
[data-theme="dark"] table.list tr:hover td{background:#131f2c}
[data-theme="dark"] .tag{background:#1b2939;color:#8b9bb0}
[data-theme="dark"] .b-l1{background:rgba(251,191,36,.14);color:#fbbf24} [data-theme="dark"] .b-l2{background:rgba(251,146,60,.14);color:#fb923c} [data-theme="dark"] .b-l3{background:rgba(248,113,113,.14);color:#f87171}
[data-theme="dark"] .b-pending{background:rgba(248,113,113,.14);color:#f87171} [data-theme="dark"] .b-handling{background:rgba(251,146,60,.14);color:#fb923c}
[data-theme="dark"] .b-confirm{background:rgba(52,211,153,.14);color:#34d399} [data-theme="dark"] .b-review{background:rgba(125,211,252,.14);color:#7dd3fc}
[data-theme="dark"] .b-archived{background:#1b2939;color:#64748b} [data-theme="dark"] .b-up{background:rgba(248,113,113,.2);color:#fca5a5}
[data-theme="dark"] .b-on{background:rgba(52,211,153,.14);color:#34d399} [data-theme="dark"] .b-off{background:#1b2939;color:#64748b} [data-theme="dark"] .b-alarm{background:rgba(248,113,113,.14);color:#f87171} [data-theme="dark"] .b-fault{background:rgba(251,146,60,.14);color:#fb923c}
[data-theme="dark"] .b-skip{background:#1b2939;color:#64748b}
[data-theme="dark"] .row-hot{background:rgba(248,113,113,.08)!important}
[data-theme="dark"] .steps .step .c{background:var(--bg);border-color:#2a3a52}
[data-theme="dark"] .step.done .c{background:var(--ok);border-color:var(--ok)}
[data-theme="dark"] .step.skip .c{background:#1b2939;border-color:#2a3a52}
[data-theme="dark"] .notif-panel .it{border-bottom-color:#1d2a3b}
[data-theme="dark"] .notif-panel .it:hover{background:#131f2c}
[data-theme="dark"] .devpop .row b{color:var(--ink)}
[data-theme="dark"] .empty{color:#64748b}
[data-theme="dark"] .demo-note{color:#64748b;border-top-color:#1d2a3b}

/* ============ 主题：政务蓝（紧凑） ============ */
[data-theme="gov"]{
  --bg:#f2f4f8; --card:#fff; --ink:#1f2d3d; --mut:#5b6b7f; --line:#d9dfe8;
  --primary:#1a4e8a; --primary-2:#163f70; --primary-bg:#e8eef6;
  --danger:#c0392b; --warn:#d4760e; --ok:#1e8449; --amber:#b7791f;
  --l1:#b7791f; --l2:#d4760e; --l3:#c0392b;
  --radius:4px; --shadow:none;
}
[data-theme="gov"] body{font-size:13px}
[data-theme="gov"] .sidebar{background:#fff;border-right:1px solid var(--line)}
[data-theme="gov"] .sidebar .logo{color:var(--primary);border-bottom-color:var(--line)}
[data-theme="gov"] .sidebar nav a{color:#3d4f63;border-radius:3px}
[data-theme="gov"] .sidebar nav a:hover{background:#eef2f7;color:var(--primary)}
[data-theme="gov"] .sidebar nav a.on{background:var(--primary);color:#fff}
[data-theme="gov"] .sidebar .foot{color:#8a99ab;border-top-color:var(--line)}
[data-theme="gov"] .login-view{background:#eef2f7}
[data-theme="gov"] .login-card{box-shadow:none;border:1px solid #d9dfe8;border-radius:6px}
[data-theme="gov"] .login-brand{background:#f6f8fb}
[data-theme="gov"] .card{border-radius:var(--radius);box-shadow:none}
[data-theme="gov"] .card .hd{padding:10px 14px}
[data-theme="gov"] .card .bd{padding:12px 14px}
[data-theme="gov"] table.list th{background:#f6f8fb;padding:7px 10px}
[data-theme="gov"] table.list td{padding:7px 10px}
[data-theme="gov"] .btn{border-radius:3px}
[data-theme="gov"] .stat{padding:10px 12px}
[data-theme="gov"] .stat .v{font-size:21px}
[data-theme="gov"] .topbar{height:48px}
[data-theme="gov"] .steps .step .c{width:24px;height:24px;font-size:11px}
[data-theme="gov"] .kv .it .v{font-size:13px}
[data-theme="gov"] .demo-note{color:#8a99ab}

@media (max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}.stat-row{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- ================= 登录页 ================= -->
<div id="login-view" class="login-view">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">校园防霸凌系统</div>
      <div class="tag">毫米波雷达 · 隐私盲区守护<br>1.0 版可点击原型（低保真）</div>
      <div class="rule">
        <b>演示角色说明</b><br>
        · 安保：接单 / 处置 / 巡更<br>
        · 班主任：确认本班工单（可配置跳过）<br>
        · 德育处：审核归档<br>
        · 访客：仅看板与设备地图（只读）<br>
        · 超管：全部权限 + 系统设置
      </div>
      <div class="rule" style="background:#fdf6e8;border-color:#f0e2c0">
        <b>演示数据</b>：以下所有告警/图表均为演示数据，仅用于走查流程
      </div>
    </div>
    <div class="login-form">
      <h1>登录管理平台</h1>
      <div class="sub">任意账号密码即可登录，选择角色体验不同权限</div>
      <div class="field"><label>演示角色</label>
        <div class="role-chips" id="login-chips">
          <button class="chip" data-r="admin">超级管理员</button>
          <button class="chip on" data-r="guard">安保值班组</button>

function route(){
  const h=location.hash.replace(/^#\/?/,'')||'workbench';
  const [page,arg]=h.split('/');
  const pageKey=page==='order'?'orders':page;   // 工单详情是 orders 的子路由
  const allowed=MENUS[S.role]||[];
  if(!allowed.includes(pageKey)){
    location.hash='#/'+(allowed[0]||'dashboard');
    return;
  }
  $('crumb').textContent=(page==='order'?'事件工单 · 工单详情':MENU_META[pageKey].n);
  if(page==='order'&&arg){$('content').innerHTML=renderOrder(arg);bindOrderDetail()}
  else renderPage(page);
}

  const allowed=MENUS[S.role];

    $('who-role').textContent=ROLE[S.role].name;

    if(!MENUS[S.role].includes(cur))location.hash='#/'+ROLE[S.role].landing;

  renderBell();
}

function svgDonut(data){
  const total=data.reduce((a,b)=>a+b[1],0);
  const colors=pal().donut;
  let acc=0,segs='';
  data.forEach((d,i)=>{
    const frac=d[1]/total, r=42, c=2*Math.PI*r;
    segs+=`<circle r="${r}" cx="60" cy="60" fill="none" stroke="${colors[i%4]}" stroke-width="16"
      stroke-dasharray="${frac*c-1.5} ${c}" stroke-dashoffset="${-acc*c}" transform="rotate(-90 60 60)"/>`;
    acc+=frac;
  });
  const legend=data.map((d,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:4px"><span style="width:9px;height:9px;border-radius:2px;background:${colors[i%4]}"></span>${d[0]}<b style="margin-left:auto">${d[1]}</b></div>`).join('');
  return `<div style="display:flex;gap:18px;align-items:center">
    <svg width="120" height="120" viewBox="0 0 120 120">${segs}<text x="60" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="${pal().ink}">${total}</text><text x="60" y="72" text-anchor="middle" font-size="10" fill="${pal().mut}">本月</text></svg>
    <div style="flex:1">${legend}</div></div>`;
}
function svgLine(data){
  const W=340,H=110,pad=14;
  const max=Math.max(...data.map(d=>d[1]))*1.15;
  const pts=data.map((d,i)=>[pad+i*(W-pad*2)/(data.length-1), H-pad-(d[1]/max)*(H-pad*2)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${pts[pts.length-1][0]} ${H-pad} L ${pts[0][0]} ${H-pad} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${pal().line}"/>`).join('');
  const labels=data.map((d,i)=>`<text x="${pts[i][0]}" y="${H-2}" text-anchor="middle" font-size="9" fill="${pal().mut}">${d[0]}</text>`).join('');
  const vlabels=[0,Math.round(max/2),Math.round(max)].map((v,i)=>`<text x="2" y="${H-pad-(v/max)*(H-pad*2)+3}" font-size="9" fill="${pal().mut}">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <path d="${area}" fill="${pal().area}" stroke="none"/>
    <path d="${line}" fill="none" stroke="${pal().line}" stroke-width="2"/>
    ${dots}${labels}${vlabels}</svg>`;
}

let rpTimer=null;
function startReplay(){
  const dot=$('rp-dot'),fill=$('rp-fill'),tm=$('rp-time'),btn=$('rp-btn');
  if(!dot)return;
  const path=$('rp-path');
  const len=path.getTotalLength();
  let t=0,dir=1,last=performance.now();
  if(rpTimer){clearInterval(rpTimer);rpTimer=null}
  btn.textContent='暂停';
  rpTimer=setInterval(()=>{
    const now=performance.now();const dt=(now-last)/1000;last=now;
    t+=dt*0.35*dir;
    if(t>1){t=1;dir=-1;tm.textContent='10.0s'}
    if(t<0){t=0;dir=1;tm.textContent='0.0s'}
    const p=path.getPointAtLength(t*len);
    dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);
    fill.style.width=(t*100)+'%';
    tm.textContent=(t*10).toFixed(1)+'s';
  },30);
  btn.onclick=()=>{clearInterval(rpTimer);rpTimer=null;btn.textContent='播放';btn.onclick=startReplay};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    clearInterval(rpTimer);rpTimer=null;btn.textContent='播放';tm.textContent='5.0s';
    const p=path.getPointAtLength(len/2);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);fill.style.width='50%';
  }
}

    <div class="modal"><div class="hd">驳回工单</div><div class="bd">
      <div class="field"><label>驳回原因（必填）</label><textarea id="r-note" rows="3" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)" placeholder="如：处置记录不完整，退回补充……"></textarea></div>
    </div><div class="ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="submitReject('${id}','${toState}')">驳回退回处置中</button></div></div></div>`;
}
function submitReject(id,toState){
  const o=findOrder(id);
  const note=$('r-note').value.trim()||'未填写原因';
  o.state='handling';
  o.log.push({op:'驳回退回',by:ROLE[S.role].user,role:ROLE[S.role].name,time:nowT(),note});
  save();closeModal();toast('已驳回，工单退回处置中');route();
}

function bindMap(){
  document.querySelectorAll('.devdot').forEach(c=>{
    c.addEventListener('click',()=>{

      const cx=+c.getAttribute('cx')/470*box.width;
      const cy=+c.getAttribute('cy')/240*box.height;
      document.querySelectorAll('.devpop').forEach(p=>p.remove());
      const pop=document.createElement('div');
      pop.className='devpop';

      pop.style.top=Math.max(cy-60,4)+'px';
      pop.innerHTML=`<div class="nm">${d.id} · 毫米波雷达</div>

      const cur=S.settings.push['l'+lv]||[];

    }).join('');
    body=`<table class="list"><thead><tr><th>告警级别</th><th>推送渠道</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="padding:14px 16px;display:flex;gap:8px;align-items:center"><button class="btn pri" onclick="savePushCfg()">保存推送设置</button><span style="font-size:12px;color:var(--mut)">电话/短信接收人按值班排班表（当前班次）路由</span></div>`;

      <table class="list" style="margin-bottom:6px">

        <tr><td><b style="color:var(--l2)">二级·告警</b></td><td><div style="display:flex;gap:12px;flex-wrap:wrap">${typeChk('l2')}</div></td>
          <td>置信度 ≥ <input type="number" id="r-conf2" value="${r.l2.confMin}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> %<br>限时处置 <input type="number" id="r-escalate" value="${r.l2.escalateMin}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> 分钟</td></tr>
        <tr><td><b style="color:var(--l3)">三级·紧急</b></td><td><div style="display:flex;gap:12px;flex-wrap:wrap">${typeChk('l3')}</div></td>
          <td>置信度 ≥ <input type="number" id="r-conf3" value="${r.l3.confMin}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> %</td></tr>
        </tbody>
      </table>
      <div style="padding:4px 0 12px"><span style="font-size:12.5px;color:var(--mut)">通用：同设备同类型事件去重合并窗口</span>
        <input type="number" id="r-dedup" value="${r.dedupMin}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> 分钟</div>

  document.querySelectorAll('#content .tabs button').forEach(b=>b.addEventListener('click',()=>{sysTab=b.dataset.t;renderPage('sys')}));
}
function savePushCfg(){
  const push={};
  [1,2,3].forEach(lv=>{
    push['l'+lv]=[...document.querySelectorAll(`#content input[data-lv="${lv}"]:checked`)].map(c=>c.dataset.ch);
  });
  S.settings.push=push;save();
  toast('推送设置已保存','ok');
}
function saveRules(){
  const getT=(lv)=>[...document.querySelectorAll(`#content input[data-lv="${lv}"][data-t]:checked`)].map(c=>c.dataset.t);
  const num=(id,def)=>{const v=parseInt($(id).value,10);return isNaN(v)||v<=0?def:v};
  S.settings.rules={
    l1:{types:getT('l1'),stayMin:num('r-stay',3),gatherN:num('r-gather',3)},
    l2:{types:getT('l2'),confMin:num('r-conf2',75),escalateMin:num('r-escalate',10)},
    l3:{types:getT('l3'),confMin:num('r-conf3',80)},
    dedupMin:num('r-dedup',5)
  };
  save();toast('告警规则已保存（分级判定/限时处置/去重窗口已生效）','ok');
}
function saveRetain(){
  const v=parseInt($('r-retain').value,10);
  S.settings.retainDays=isNaN(v)||v<1?30:v;save();
  toast('取证保留期已保存：'+S.settings.retainDays+' 天（次日凌晨生效）','ok');
}
function toggleSkip(){
  S.settings.skipTeacher=!S.settings.skipTeacher;save();
  toast('班主任确认环节已'+(S.settings.skipTeacher?'配置跳过（处置后直接进德育处审核）':'启用（需班主任确认）'),'ok');
  renderPage('sys');
}

/* ---- 权限管理（角色 + 账号 合并页） ---- */
let permTab='roles';
function pgPerm(){
  const tabs=[['roles','角色管理'],['accounts','账号管理']].map(t=>`<button class="${permTab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  return `<div class="card" style="margin-bottom:14px"><div class="hd" style="padding:0"><div class="tabs" style="border:none;width:100%">${tabs}</div></div></div>`+(permTab==='roles'?pgRoles():pgAccounts());
}
function bindPerm(){
  document.querySelectorAll('#content .tabs button').forEach(b=>b.addEventListener('click',()=>{permTab=b.dataset.t;renderPage('perm')}));
  if(permTab==='roles')bindRoles();
}

/* ---- 角色/账号（可配置版） ---- */
let roleSel='guard';
let permDirty=false;
function pgRoles(){
  const sel=S.roles.find(r=>r.id===roleSel)||S.roles[0];
  roleSel=sel.id;permDirty=false;
  const locked=sel.id==='admin';
  const menuTree=MENU_ITEMS.map(([k,n])=>{
    const on=sel.perms.menu.includes(k);
    return `<label><input type="checkbox" data-cat="menu" data-k="${k}" ${on?'checked':''} ${locked?'disabled':''}> ${n}</label>`;
  }).join('');
  const btnTree=BTN_ITEMS.map(([k,n])=>{
    const on=sel.perms.btns.includes(k);
    return `<label><input type="checkbox" data-cat="btns" data-k="${k}" ${on?'checked':''} ${locked?'disabled':''}> ${n}</label>`;
  }).join('');
  return `<div class="grid3">
    <div class="card"><div class="hd">角色列表<span class="tag">${S.roles.length}</span><div class="sp"></div><button class="btn sm pri" onclick="openRoleModal()">+ 新建角色</button></div>
      <div class="bd" style="padding:8px">
      ${S.roles.map(r=>`<div style="padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;${roleSel===r.id?'background:var(--primary-bg);border-color:#c9dcf2':''}" onclick="roleSel='${r.id}';renderPage('perm')">
        <b style="font-size:13px">${esc(r.name)}</b>${r.builtin?'<span class="tag">内置</span>':''}<div style="font-size:11.5px;color:var(--mut)">${esc(r.desc)}</div></div>`).join('')}
      </div></div>
    <div class="card"><div class="hd">功能权限 · ${esc(sel.name)}
      ${locked?'<span class="tag" style="color:var(--danger);background:#fbe4e1">内置超管锁定不可改</span>':''}
      <div class="sp"></div><button class="btn sm pri" id="perm-save" ${locked?'disabled':''} onclick="savePerms()">保存权限</button></div>
      <div class="bd"><div class="ptree">
        <div class="grp">菜单权限</div>${menuTree}
        <div class="grp">按钮权限</div>${btnTree}
      </div>
      <div class="demo-note">修改后点「保存权限」生效；自定义角色可在此勾选菜单与按钮权限</div></div></div>
  </div>`;
}
function bindRoles(){
  document.querySelectorAll('#content .ptree input[type=checkbox]:not(:disabled)').forEach(c=>{
    c.addEventListener('change',()=>{
      permDirty=true;
      const b=$('perm-save');if(b){b.style.outline='2px solid var(--warn)';b.textContent='保存权限（有未保存修改）'}
    });
  });
}
function savePerms(){
  const sel=S.roles.find(r=>r.id===roleSel);
  if(!sel||sel.id==='admin')return;
  sel.perms.menu=[...document.querySelectorAll('#content .ptree input[data-cat="menu"]:checked')].map(c=>c.dataset.k);
  sel.perms.btns=[...document.querySelectorAll('#content .ptree input[data-cat="btns"]:checked')].map(c=>c.dataset.k);
  save();permDirty=false;
  const b=$('perm-save');if(b){b.style.outline='none';b.textContent='保存权限'}
  toast('权限已保存：'+sel.name,'ok');
}
function openRoleModal(){
  $('modal-root').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="hd">新建角色</div><div class="bd">
      <div class="field"><label>角色名称（必填）</label><input id="nr-name" placeholder="如：宿管组" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      <div class="field"><label>角色描述</label><input id="nr-desc" placeholder="如：负责宿舍区域巡查与告警处置" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>
    </div><div class="ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="createRole()">创建</button></div></div></div>`;
}
function createRole(){
  const name=$('nr-name').value.trim();
  if(!name){toast('请填写角色名称','err');return}
  const id='r'+Date.now().toString(36);
  S.roles.push({id,name,desc:$('nr-desc').value.trim()||'自定义角色',builtin:false,perms:{menu:['dashboard','workbench'],btns:[]}});
  save();closeModal();roleSel=id;renderPage('perm');
  toast('角色已创建：'+name+'（可在右侧配置权限）','ok');
}
function pgAccounts(){
  const rows=S.accounts;
  const roleOpts=S.roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
  return `<div class="card"><div class="hd">账号管理<span class="tag">${rows.length} 个账号</span><div class="sp"></div>
    <button class="btn pri sm" onclick="openAccModal()">+ 新建账号</button></div>
    <div class="filters"><input id="acc-q" placeholder="姓名/账号模糊查询" oninput="filterAcc()">
      <select id="acc-f-role" onchange="filterAcc()"><option value="">全部角色</option>${roleOpts}</select>
      <select id="acc-f-status" onchange="filterAcc()"><option value="">全部状态</option><option value="on">启用</option><option value="off">禁用</option></select></div>
    <table class="list"><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>手机号</th><th>负责区域/班级</th><th>最近登录</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="acc-tbody">${accRows(rows)}</tbody></table></div>`;
}
function accRows(rows){
  return rows.map(a=>`<tr data-user="${esc(a.user)}">
    <td class="mono">${esc(a.user)}</td><td>${esc(a.name)}</td><td>${esc(roleName(a.role))}</td>
    <td>${esc(a.phone)}</td><td>${esc(a.scope)}</td><td>${esc(a.last||'—')}</td>
    <td>${a.status==='on'?'<span class="badge b-on">启用</span>':'<span class="badge b-off">禁用</span>'}</td>
    <td><a href="javascript:void 0" onclick="openAccModal('${esc(a.user)}')">编辑</a>
        <span style="color:var(--line)">|</span>
        <a href="javascript:void 0" onclick="toggleAcc('${esc(a.user)}')">${a.status==='on'?'禁用':'启用'}</a></td></tr>`).join('');
}
function filterAcc(){
  const q=($('acc-q').value||'').trim().toLowerCase();
  const fr=$('acc-f-role').value, fs=$('acc-f-status').value;
  const list=S.accounts.filter(a=>
    (!q||a.user.toLowerCase().includes(q)||a.name.toLowerCase().includes(q)) &&
    (!fr||a.role===fr) && (!fs||a.status===fs));
  $('acc-tbody').innerHTML=accRows(list);
}
function openAccModal(user){
  const a=user?S.accounts.find(x=>x.user===user):null;
  const roleOpts=S.roles.map(r=>`<option value="${r.id}" ${(a?a.role==r.id:r.id==='guard')?'selected':''}>${esc(r.name)}</option>`).join('');
  $('modal-root').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="hd">${a?'编辑账号':'新建账号'}</div><div class="bd">
      <div class="field"><label>登录账号${a?'（不可修改）':'（必填）'}</label><input id="ac-user" value="${a?esc(a.user):''}" ${a?'disabled':''} style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      <div class="field"><label>登录密码</label><input id="ac-pass" type="password" value="123456" ${a?'':'value="123456"'} placeholder="${a?'留空则不修改':'默认 123456，首登强制修改'}" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      <div class="field"><label>姓名（必填）</label><input id="ac-name" value="${a?esc(a.name):''}" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      <div class="field"><label>手机号</label><input id="ac-phone" value="${a?esc(a.phone):''}" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>角色</label><select id="ac-role" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:var(--radius)">${roleOpts}</select></div>
        <div class="field"><label>负责区域/班级</label><input id="ac-scope" value="${a?esc(a.scope):''}" placeholder="班主任必填" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      </div>
    </div><div class="ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="saveAcc('${a?a.user:''}')">保存</button></div></div></div>`;
}
function saveAcc(user){
  const name=$('ac-name').value.trim();
  if(!name){toast('请填写姓名','err');return}
  if(user){
    const a=S.accounts.find(x=>x.user===user);
    a.name=name;a.phone=$('ac-phone').value.trim();a.role=$('ac-role').value;a.scope=$('ac-scope').value.trim();
    save();closeModal();renderPage('perm');toast('账号已更新：'+a.user,'ok');
  }else{
    const u=$('ac-user').value.trim();
    if(!u){toast('请填写登录账号','err');return}
    if(S.accounts.some(x=>x.user===u)){toast('账号已存在：'+u,'err');return}
    S.accounts.push({user:u,name,role:$('ac-role').value,phone:$('ac-phone').value.trim(),scope:$('ac-scope').value.trim(),last:'—',status:'on'});
    save();closeModal();renderPage('perm');toast('账号已创建：'+u+'（默认密码 123456）','ok');
  }
}
function toggleAcc(user){
  const a=S.accounts.find(x=>x.user===user);
  a.status=a.status==='on'?'off':'on';
  save();renderPage('perm');
  toast((a.status==='on'?'已启用':'已禁用')+'：'+user,'ok');
}
function bindAccounts(){}

/* ---- 通知中心 ---- */
function renderBell(){
  const n=pendingCount();
  const dot=$('bell-dot');
  dot.hidden=n===0;dot.textContent=n>99?'99+':n;
}
function toggleNotif(){
  const old=document.querySelector('.notif-panel');
  if(old){old.remove();return}
  const items=[];
  S.orders.filter(o=>o.state==='pending').forEach(o=>items.push([o,o.escalated?'超时未接单，已升级':'新告警待接单']));
  S.orders.filter(o=>o.state==='handling').forEach(o=>items.push([o,'处置中']));
  if(S.role==='teacher')S.orders.filter(o=>o.state==='teacher_confirm').forEach(o=>items.push([o,'待您确认']));
  if(S.role==='dean')S.orders.filter(o=>o.state==='dean_review').forEach(o=>items.push([o,'待您审核']));
  const html=items.map(([o,m])=>`<div class="it" onclick="location.hash='#/order/${o.id}';document.querySelector('.notif-panel')?.remove()">
    <span class="badge b-l${o.level}">${LEVELS[o.level].n}</span><div><div class="t">${esc(o.type)} · ${esc(o.loc)}</div><div class="m">${esc(o.id)} · ${m}</div></div></div>`).join('');
  const panel=document.createElement('div');
  panel.className='notif-panel';
  panel.style.position='fixed';
  const bell=$('bell').getBoundingClientRect();
  panel.style.top=(bell.bottom+8)+'px';
  panel.style.right=(window.innerWidth-bell.right)+'px';
  panel.innerHTML=`<div class="hd">通知中心<span>${items.length} 条</span></div>${html||'<div class="empty" style="padding:24px">暂无通知</div>'}`;
  document.body.appendChild(panel);
}

/* ================= 启动 ================= */
applyTheme();
bindLogin();bindTopbar();
if(S.role&&ROLE[S.role]){enterApp()}else{location.hash=''}
</script>
</body>
</html>
