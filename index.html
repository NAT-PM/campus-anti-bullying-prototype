<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微澜守护 · 校园防霸凌预警系统（原型）</title>
<style>
:root{
  --bg:#f5f8f6; --card:#fff; --ink:#243b33; --mut:#6d8379; --line:#e4ece7;
  --primary:#2f9e6e; --primary-2:#27855c; --primary-bg:#e6f4ec;
  --danger:#d65c4a; --warn:#e07b39; --ok:#2f9e6e; --amber:#d9a13b;
  --l1:#d9a13b; --l2:#e07b39; --l3:#d65c4a;
  --radius:10px; --shadow:0 2px 10px rgba(36,59,51,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

/* ---------- 登录页 ---------- */
.login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#e9f4ee 0%,#f2f7f3 60%,#f7faf8 100%)}
.login-card{width:880px;max-width:94vw;background:var(--card);border-radius:16px;display:flex;overflow:hidden;box-shadow:0 14px 44px rgba(36,59,51,.14);border:1px solid var(--line)}
.login-brand{width:44%;background:#eef7f1;padding:36px 28px;display:flex;flex-direction:column;gap:14px}
.login-brand .logo{font-size:20px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:10px}
.login-brand .tag{font-size:13px;color:var(--mut);line-height:1.7}
.login-brand .rule{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:12.5px;color:var(--mut);line-height:1.8}
.login-form{flex:1;padding:40px 36px}
.login-form h1{font-size:20px;margin-bottom:4px}
.login-form .sub{color:var(--mut);font-size:13px;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.field input:focus,.field select:focus{outline:2px solid var(--primary-bg);border-color:var(--primary)}
.role-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--mut);background:#fff}
.chip.on{border-color:var(--primary);color:var(--primary);background:var(--primary-bg);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);font-weight:600;font-size:13px;transition:filter .12s}
.btn:hover{filter:brightness(.97)}
.btn:active{filter:brightness(.93)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

/* ---------- 主框架 ---------- */
.app-view{display:flex;height:100vh;overflow:hidden}
.sidebar{width:208px;flex:none;background:#fff;border-right:1px solid var(--line);color:var(--mut);display:flex;flex-direction:column}
.sidebar .logo{padding:16px 18px;font-size:15px;font-weight:700;color:var(--primary);border-bottom:1px solid var(--line);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.sidebar nav{flex:1;padding:10px 8px;overflow:auto}
.sidebar nav a{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:#5b7268;text-decoration:none;font-size:13.5px;margin-bottom:2px}
.sidebar nav a:hover{background:#f0f7f3;color:var(--primary)}
.sidebar nav a.on{background:var(--primary-bg);color:var(--primary);font-weight:600}
.sidebar .foot{padding:12px 16px;font-size:11.5px;color:#9db2a8;border-top:1px solid var(--line)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
.topbar .crumb{font-size:15px;font-weight:700}
.topbar .sp{flex:1}
.bell{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.rolebox{display:flex;align-items:center;gap:8px}
.rolebox .who{text-align:right;line-height:1.25}
.rolebox .who b{font-size:13px;display:block}
.rolebox .who span{font-size:11.5px;color:var(--mut)}
.rolebox select{padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:12.5px}
#content{flex:1;overflow:auto;padding:18px}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
.card .hd{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.card .hd .sp{flex:1}
.card .bd{padding:16px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.stat .k{font-size:12.5px;color:var(--mut)}
.stat .v{font-size:24px;font-weight:700;margin-top:3px}
.stat .v small{font-size:13px;color:var(--mut);font-weight:400}
.stat .sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{background:#f2f7f4;text-align:left;padding:9px 12px;color:var(--mut);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:9px 12px;border-bottom:1px solid #eef4f0;vertical-align:middle}
table.list tr:hover td{background:#f6faf7}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-l1{background:#faf3e2;color:#c98a2e} .b-l2{background:#fdeee4;color:#d4682f} .b-l3{background:#fbe7e2;color:#c94f3c}
.b-pending{background:#fbe7e2;color:#c94f3c} .b-handling{background:#fdeee4;color:#d4682f}
.b-confirm{background:#e6f4ec;color:#27855c} .b-review{background:#e9f0fb;color:#5b7fd4}
.b-archived{background:#edf2ef;color:#8ba096} .b-up{background:#fbe7e2;color:#c0392b}
.b-on{background:#e6f4ec;color:#27855c} .b-off{background:#edf2ef;color:#8ba096} .b-alarm{background:#fbe7e2;color:#c94f3c} .b-fault{background:#fdeee4;color:#c98a2e}
.b-skip{background:#edf2ef;color:#8ba096}
.row-hot{background:#fff5f5!important}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters select,.filters input{padding:6px 9px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:12.5px}
.filters .sp{flex:1}
.tag{display:inline-block;background:#eef1f6;color:var(--mut);border-radius:4px;padding:1px 6px;font-size:11.5px;margin-left:4px}
.empty{padding:40px;text-align:center;color:var(--mut);font-size:13px}

/* 步骤条 */
.steps{display:flex;align-items:flex-start;padding:6px 0 4px}
.step{flex:1;position:relative;text-align:center}
.step::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step .c{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mut);position:relative;z-index:1}
.step.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .c{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-bg)}
.step.skip .c{background:#eef1f6;border-color:#d8dfe8;color:#9aa7b8}
.step.done::before,.step.cur::before{background:var(--ok)}
.step .t{font-size:12px;color:var(--mut);margin-top:6px}
.step.cur .t{color:var(--ink);font-weight:700}
.step.done .t{color:var(--ok)}
.step.skip .t{color:#9aa7b8}

/* 详情 */
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px}
.kv .it .k{font-size:12px;color:var(--mut)}
.kv .it .v{font-size:13.5px;font-weight:600;margin-top:1px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding-bottom:14px}
.tl .it::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.tl .it .who{font-size:13px;font-weight:600}
.tl .it .when{font-size:11.5px;color:var(--mut)}
.tl .it .note{font-size:12.5px;color:var(--mut);margin-top:2px}

/* 轨迹回放 */
.replay-wrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);overflow:hidden}
.replay-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.replay-head .sp{flex:1}
.replay svg{display:block;width:100%;height:150px}
.replay .playbar{height:6px;background:var(--line);position:relative}
.replay .playbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--primary);width:0%}

/* 模态 */
.modal-mask{position:fixed;inset:0;background:rgba(36,59,51,.42);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{width:480px;max-width:92vw;background:var(--card);border-radius:8px;box-shadow:0 16px 50px rgba(9,20,40,.3)}
.modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px}
.modal .bd{padding:16px 18px}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* 逻辑标注面板（评审模式） */
#annot-btn.on{background:var(--primary-bg);color:var(--primary);border-color:#cfe3d6}
.annot-panel{position:fixed;top:52px;right:0;bottom:0;width:300px;background:#fdf8e3;border-left:1px solid #e8d9a8;box-shadow:-6px 0 20px rgba(120,90,20,.08);transform:translateX(100%);transition:transform .22s ease;z-index:35;overflow-y:auto;padding:0}
body.annot-on .annot-panel{transform:none}
body.annot-on #content{margin-right:300px}
.annot-panel .annot-hd{padding:12px 16px;border-bottom:1px solid #efe2b4;display:flex;justify-content:space-between;align-items:center}
.annot-panel .annot-item{padding:11px 16px;border-bottom:1px dashed #efe2b4}
.annot-panel .annot-item .t{font-size:13px;font-weight:700;color:#6b5b1e;display:flex;gap:7px;align-items:baseline}
.annot-panel .annot-item .t .n{color:#b8952e;font-size:12px}
.annot-panel .annot-item .t .atag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;flex:none}
.atag-op{background:#e6f4ec;color:#27855c}
.atag-jump{background:#e9f0fb;color:#5b7fd4}
.atag-field{background:#faf3e2;color:#c98a2e}
.atag-rule{background:#eef1f6;color:#8ba096}
.annot-panel .annot-item .b{font-size:12px;color:#7d6f3a;line-height:1.6;margin-top:3px}
.annot-panel .annot-item .b .li{text-indent:-14px;padding-left:14px;margin-bottom:2px}
.annot-panel .annot-foot{padding:10px 16px;font-size:11px;color:#a8955a;display:flex;align-items:center;justify-content:space-between}

/* ⓘ 悬停提示（评审模式） */
.hint{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#fdf3cd;color:#b8952e;font-size:10.5px;font-weight:700;margin-left:6px;cursor:help;position:relative;vertical-align:middle}
.tipbox{position:fixed;z-index:9999;background:#243b33;color:#fff;font-size:12px;line-height:1.6;padding:8px 12px;border-radius:6px;max-width:260px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}

/* toast */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#243b33;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(36,59,51,.3);animation:tin .18s ease}
.toast.ok{background:var(--ok)} .toast.err{background:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}

/* 通知面板 */
.notif-panel{position:absolute;top:44px;right:0;width:340px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 34px rgba(9,20,40,.16);overflow:hidden;z-index:40}
.notif-panel .hd{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.notif-panel .it{padding:10px 14px;border-bottom:1px solid #f0f2f6;font-size:12.5px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.notif-panel .it:hover{background:#f7f9fc}
.notif-panel .it .t{font-weight:600}
.notif-panel .it .m{color:var(--mut);font-size:12px;margin-top:1px}

/* 地图 */
.campus{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.campus svg{width:100%;height:auto;display:block}
.devdot{cursor:pointer}
.devpop{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(9,20,40,.18);padding:12px 14px;width:230px;font-size:12.5px;z-index:30}
.devpop .nm{font-weight:700;font-size:13.5px;margin-bottom:4px}
.devpop .row{display:flex;justify-content:space-between;padding:2px 0;color:var(--mut)}
.devpop .row b{color:var(--ink)}

/* 排班日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{border:1px solid var(--line);border-radius:var(--radius);min-height:76px;padding:6px;background:#fff;font-size:12px}
.cal .d .dn{color:var(--mut);font-size:11.5px}
.cal .d .sh{display:block;margin-top:3px;padding:2px 5px;border-radius:4px;background:var(--primary-bg);color:var(--primary);font-size:11px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 14px;background:#fff;overflow-x:auto}
.tabs button{padding:10px 16px;border:none;background:none;font-weight:600;font-size:13.5px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}

/* 权限树 */
.ptree{font-size:13px}
.ptree .grp{font-weight:700;margin:10px 0 4px}
.ptree label{display:flex;align-items:center;gap:7px;padding:3px 0;font-weight:400;color:#33415c}
.ptree input{accent-color:var(--primary)}

.demo-note{font-size:11.5px;color:var(--mut);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}.stat-row{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- 品牌 LOGO 符号（青禾守护：盾牌+禾苗+雷达波纹） -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3cb384"/><stop offset="1" stop-color="#27855c"/>
    </linearGradient>
    <linearGradient id="lg-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8f3e6"/>
    </linearGradient>
    <symbol id="logo-mark" viewBox="0 0 200 200">
      <path d="M100 14 L170 41 V103 C170 146 138 170 100 186 C62 170 30 146 30 103 V41 Z" fill="url(#lg-shield)"/>
      <path d="M62 140 A38 38 0 0 1 138 140" fill="none" stroke="#a8e4cd" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>
      <path d="M46 144 A54 54 0 0 1 154 144" fill="none" stroke="#c9f0e0" stroke-width="4.5" stroke-linecap="round" opacity=".7"/>
      <path d="M100 150 C100 132 100 112 100 92" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <path d="M100 112 C86 100 76 88 72 74 C88 72 102 84 100 112 Z" fill="url(#lg-leaf)"/>
      <path d="M100 100 C114 88 124 76 128 62 C112 60 98 72 100 100 Z" fill="url(#lg-leaf)"/>
      <circle cx="100" cy="86" r="4.5" fill="#ffffff"/>
    </symbol>
  </defs>
</svg>

<!-- ================= 登录页 ================= -->
<div id="login-view" class="login-view">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo"><svg viewBox="0 0 200 200" width="44" height="44" style="flex:none"><use href="#logo-mark"/></svg>微澜守护</div>
      <div class="tag">毫米波雷达 · 隐私盲区守护<br>1.0 版可点击原型（高保真 · 清新绿）</div>
      <div class="rule">
        <b>演示角色说明</b><br>
        · 安保：接单 / 处置 / 巡更<br>
        · 班主任：确认本班工单（可配置跳过）<br>
        · 德育处：审核归档<br>
        · 访客：仅看板与设备地图（只读）<br>
        · 超管：全部权限 + 系统设置
      </div>
      <div class="rule" style="background:#fdf6e8;border-color:#f0e2c0">
        <b>演示数据</b>：以下所有告警/图表均为演示数据，仅用于走查流程
      </div>
    </div>
    <div class="login-form">
      <h1>登录管理平台</h1>
      <div class="sub">任意账号密码即可登录，选择角色体验不同权限</div>
      <div class="field"><label>演示角色</label>
        <div class="role-chips" id="login-chips">
          <button class="chip" data-r="admin">超级管理员</button>
          <button class="chip on" data-r="guard">安保值班组</button>
          <button class="chip" data-r="teacher">班主任</button>
          <button class="chip" data-r="dean">德育处</button>
          <button class="chip" data-r="guest">只读访客</button>
        </div>
      </div>
      <div class="field"><label>账号</label><input id="login-user" placeholder="任意账号（演示）" value="zhangwei"></div>
      <div class="field"><label>密码</label><input id="login-pass" type="password" placeholder="任意密码（演示）" value="123456"></div>
      <div style="margin:6px 0 14px;font-size:12.5px;color:var(--mut)"><label><input type="checkbox" checked> 记住我（原型演示）</label></div>
      <button class="btn pri block" id="login-btn">登 录</button>
    </div>
  </div>
</div>

<!-- ================= 主应用 ================= -->
<div id="app-view" class="app-view" hidden>
  <aside class="sidebar">
    <div class="logo"><svg viewBox="0 0 200 200" width="26" height="26" style="flex:none"><use href="#logo-mark"/></svg>微澜守护</div>
    <nav id="menu"></nav>
    <div class="foot">微澜守护 1.0 原型 · 演示数据<br>高保真 · 清新绿</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="sp"></div>
      <button class="btn sm" id="annot-btn" title="评审模式：显示/隐藏功能逻辑标注">📌 标注</button>
      <div class="bell" id="bell" title="通知中心">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="dot" id="bell-dot" hidden></span>
      </div>
      <div class="rolebox">
        <div class="who"><b id="who-name"></b><span id="who-role"></span></div>

function route(){

  const [page,arg]=h.split('/');
  const pageKey=page==='order'?'orders':page;   // 工单详情是 orders 的子路由

  if(!allowed.includes(pageKey)){

    return;
  }
  $('crumb').textContent=(page==='order'?'事件工单 · 工单详情':MENU_META[pageKey].n);
  if(page==='order'&&arg){$('content').innerHTML=renderOrder(arg);bindOrderDetail()}
  else renderPage(page);
  curPageKey=page==='order'?'order':pageKey;
  renderAnnot(curPageKey);
  injectHints(curPageKey);
  renderSidebar();
}

  $('who-role').textContent=ROLE[S.role].name;
  if(!MENUS[S.role].includes((location.hash||'').replace(/^#\/?/,'').split('/')[0]))location.hash='';

  route(); renderSidebar();

  const allowed=MENUS[S.role];
  $('menu').innerHTML=allowed.map(p=>`<a href="#/${p}" data-p="${p}">${MENU_META[p].n}</a>`).join('');
  document.querySelectorAll('#menu a').forEach(a=>{
    a.classList.toggle('on',a.dataset.p===routePage());

function routePage(){const p=(location.hash.replace(/^#\/?/,'')||'').split('/')[0];return p==='order'?'orders':p}
function bindTopbar(){
  $('role-switch').addEventListener('change',e=>{
    S.role=e.target.value; save();
    $('who-name').textContent=ROLE[S.role].user;
    $('who-role').textContent=ROLE[S.role].name;
    renderSidebar();
    const cur=routePage();
    if(!MENUS[S.role].includes(cur))location.hash='#/'+ROLE[S.role].landing;
    else route();
    toast('已切换为：'+ROLE[S.role].name,'ok');
  });
  $('logout').addEventListener('click',()=>{
    S.role='';save();
    $('app-view').hidden=true;$('login-view').hidden=false;
    location.hash='';
  });
  $('bell').addEventListener('click',()=>toggleNotif());

}

function renderPage(p){
  const map={dashboard:pgDashboard,workbench:pgWorkbench,orders:pgOrders,map:pgMap,devices:pgDevices,patrol:pgPatrol,schedule:pgSchedule,sys:pgSys,perm:pgPerm,notifs:pgNotifs,audit:pgAudit};
  const fn=map[p]||pgWorkbench;
  $('content').innerHTML=fn();
  if(p==='orders')bindOrders();
  if(p==='devices')bindDevices();
  if(p==='patrol')bindPatrol();
  if(p==='sys')bindSys();
  if(p==='perm')bindPerm();
  if(p==='notifs')bindNotifs();
  if(p==='audit')bindAudit();
  if(p==='map')bindMap();
  injectHints(curPageKey);
  renderBell();

function svgDonut(data){
  const total=data.reduce((a,b)=>a+b[1],0);
  const colors=pal().donut;
  let acc=0,segs='';
  data.forEach((d,i)=>{
    const frac=d[1]/total, r=42, c=2*Math.PI*r;
    segs+=`<circle r="${r}" cx="75" cy="75" fill="none" stroke="${colors[i%4]}" stroke-width="16"
      stroke-dasharray="${frac*c-1.5} ${c}" stroke-dashoffset="${-acc*c}" transform="rotate(-90 75 75)"/>`;
    acc+=frac;
  });
  return `<svg width="150" height="150" viewBox="0 0 150 150">${segs}<text x="75" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="${pal().ink}">${total}</text><text x="75" y="90" text-anchor="middle" font-size="10" fill="${pal().mut}">本月告警</text></svg>`;
}
function svgLine(data){
  const W=340,H=120,pad=16;
  const max=Math.max(...data.map(d=>d[1]))*1.15;
  const pts=data.map((d,i)=>[pad+i*(W-pad*2)/(data.length-1), H-pad-(d[1]/max)*(H-pad*2)]);
  // 平滑贝塞尔曲线
  let line='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i],p1=pts[i+1],mx=(p0[0]+p1[0])/2;
    line+=' C'+mx.toFixed(1)+' '+p0[1].toFixed(1)+','+mx.toFixed(1)+' '+p1[1].toFixed(1)+','+p1[0].toFixed(1)+' '+p1[1].toFixed(1);
  }
  const area=line+` L ${pts[pts.length-1][0].toFixed(1)} ${H-pad} L ${pts[0][0].toFixed(1)} ${H-pad} Z`;
  const grid=[0.25,0.5,0.75].map(f=>`<line x1="${pad}" y1="${(H-pad-f*(H-pad*2)).toFixed(1)}" x2="${W-pad}" y2="${(H-pad-f*(H-pad*2)).toFixed(1)}" stroke="${pal().mut}" stroke-opacity=".15" stroke-dasharray="3 4"/>`).join('');
  const glow=`<path d="${line}" fill="none" stroke="${pal().line}" stroke-opacity=".3" stroke-width="6" stroke-linecap="round"/>`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4.5:2.8}" fill="${i===pts.length-1?'#fff':pal().line}" stroke="${pal().line}" stroke-width="2"/>`).join('');
  const labels=data.map((d,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${H-2}" text-anchor="middle" font-size="9" fill="${pal().mut}">${d[0]}</text>`).join('');
  const vlabels=[0,Math.round(max/2),Math.round(max)].map((v,i)=>`<text x="2" y="${(H-pad-(v/max)*(H-pad*2)+3).toFixed(1)}" font-size="9" fill="${pal().mut}">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="lg-trend" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${pal().line}" stop-opacity=".4"/><stop offset="100%" stop-color="${pal().line}" stop-opacity=".02"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#lg-trend)"/>
    ${glow}
    <path d="${line}" fill="none" stroke="${pal().line}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}${vlabels}</svg>`;
}

let rpTimer=null;
function startReplay(){
  const dot=$('rp-dot'),fill=$('rp-fill'),tm=$('rp-time'),btn=$('rp-btn');
  if(!dot)return;
  const path=$('rp-path');
  const len=path.getTotalLength();
  let t=0,dir=1,last=performance.now();
  if(rpTimer){clearInterval(rpTimer);rpTimer=null}
  btn.textContent='暂停';
  rpTimer=setInterval(()=>{
    const now=performance.now();const dt=(now-last)/1000;last=now;
    t+=dt*0.35*dir;
    if(t>1){t=1;dir=-1;tm.textContent='10.0s'}
    if(t<0){t=0;dir=1;tm.textContent='0.0s'}
    const p=path.getPointAtLength(t*len);
    dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);
    fill.style.width=(t*100)+'%';
    tm.textContent=(t*10).toFixed(1)+'s';
  },30);
  btn.onclick=()=>{clearInterval(rpTimer);rpTimer=null;btn.textContent='播放';btn.onclick=startReplay};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    clearInterval(rpTimer);rpTimer=null;btn.textContent='播放';tm.textContent='5.0s';
    const p=path.getPointAtLength(len/2);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);fill.style.width='50%';
  }
}

const ALERT_TYPES=['单人滞留','多人聚集','推搡拉扯','摔倒','暴力冲突'];
function pgSys(){
  const tabs=[['push','推送配置'],['rules','告警规则'],['templates','消息模板'],['safety','数据安全'],['school','学校信息'],['dict','点位字典'],['retain','取证保留期'],['flow','审批流开关']].map(t=>`<button class="${sysTab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  let body='';
  if(sysTab==='push'){
    const rows=[1,2,3].map(lv=>{
      const cur=S.settings.push['l'+lv]||[];
      const ch=[['popup','平台弹窗'],['app','小程序通知'],['wechat','微信通知'],['sms','短信'],['phone','电话']];
      const cells=ch.map(c=>`<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer"><input type="checkbox" data-lv="${lv}" data-ch="${c[0]}" ${cur.includes(c[0])?'checked':''} style="accent-color:var(--primary)">${c[1]}</label>`).join('');
      return `<tr><td><b>${LEVELS[lv].n}</b><div style="font-size:11.5px;color:var(--mut)">${lv===1?'记录，无需强制处置':lv===2?`${S.settings.rules.l2.escalateMin} 分钟内接单处置，超时自动升级`:'立即处置，同步班主任'}</div></td><td><div style="display:flex;gap:14px;flex-wrap:wrap">${cells}</div></td></tr>`;
    }).join('');
    body=`<table class="list"><thead><tr><th>告警级别</th><th>推送渠道</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="padding:14px 16px;display:flex;gap:8px;align-items:center"><button class="btn pri" onclick="savePushCfg()">保存推送设置</button><span style="font-size:12px;color:var(--mut)">电话/短信接收人按值班排班表（当前班次）路由</span></div>`;
  }else if(sysTab==='rules'){
    const r=S.settings.rules;
    const typeChk=(lvl)=>ALERT_TYPES.map(t=>`<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer"><input type="checkbox" data-lv="${lvl}" data-t="${t}" ${r[lvl].types.includes(t)?'checked':''} style="accent-color:var(--primary)">${t}</label>`).join('');
    body=`<div class="bd">
      <table class="list" style="margin-bottom:6px">
        <thead><tr><th style="width:130px">级别</th><th>触发事件类型</th><th style="width:220px">判定参数</th></tr></thead>
        <tbody>
        <tr><td><b style="color:var(--l1)">一级·预警</b></td><td><div style="display:flex;gap:12px;flex-wrap:wrap">${typeChk('l1')}</div></td>
          <td>滞留阈值 <input type="number" id="r-stay" value="${r.l1.stayMin}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> 分钟<br>聚集人数 ≥ <input type="number" id="r-gather" value="${r.l1.gatherN}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> 人</td></tr>
        <tr><td><b style="color:var(--l2)">二级·告警</b></td><td><div style="display:flex;gap:12px;flex-wrap:wrap">${typeChk('l2')}</div></td>
          <td>置信度 ≥ <input type="number" id="r-conf2" value="${r.l2.confMin}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> %<br>限时处置 <input type="number" id="r-escalate" value="${r.l2.escalateMin}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> 分钟</td></tr>
        <tr><td><b style="color:var(--l3)">三级·紧急</b></td><td><div style="display:flex;gap:12px;flex-wrap:wrap">${typeChk('l3')}</div></td>
          <td>置信度 ≥ <input type="number" id="r-conf3" value="${r.l3.confMin}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> %</td></tr>
        </tbody>
      </table>
      <div style="padding:4px 0 12px"><span style="font-size:12.5px;color:var(--mut)">通用：同设备同类型事件去重合并窗口</span>
        <input type="number" id="r-dedup" value="${r.dedupMin}" style="width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius)"> 分钟</div>
      <button class="btn pri" onclick="saveRules()">保存告警规则</button>
      <div class="demo-note">规则保存后即生效：分级判定、限时处置（工单页联动显示）、去重合并窗口</div>
    </div>`;
  }else if(sysTab==='templates'){
    const tp=S.settings.templates;
    const rows=[['wechat','微信告警通知','发送对象：值班人员（二级以上）',tp.wechat],['sms','短信告警通知','发送对象：值班手机（三级）',tp.sms],['confirm','班主任确认通知','发送对象：班主任',tp.confirm]].map(([k,n,desc,v])=>`<tr><td style="width:180px"><b>${n}</b><div style="font-size:11.5px;color:var(--mut)">${desc}</div></td><td><textarea id="tp-${k}" style="width:100%;min-height:56px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);font-size:12.5px">${esc(v)}</textarea></td></tr>`).join('');
    body=`<table class="list"><thead><tr><th>模板</th><th>内容（支持占位符）</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="padding:12px 16px"><span style="font-size:12px;color:var(--mut)">可用占位符：</span><code style="font-size:11.5px;background:var(--bg);padding:2px 6px;border-radius:4px">{time}</code> <code>{location}</code> <code>{type}</code> <code>{level}</code> <code>{id}</code>
    <button class="btn pri" style="margin-left:12px" onclick="saveTemplates()">保存模板</button></div>
    <div class="demo-note">占位符在发送时替换为真实事件数据；模板变更即时生效</div>`;
  }else if(sysTab==='safety'){
    body=`<div class="bd"><div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px">
      <input type="checkbox" id="s-face" ${S.settings.safety.face?'checked':''} style="width:18px;height:18px;accent-color:var(--primary)"> 人脸抓拍 / 人员识别功能总开关</label></div>
    <div style="font-size:12.5px;color:var(--mut);line-height:1.8">合规说明：依据《个人信息保护法》《未成年人保护法》，人脸类功能默认关闭；开启后仅存储结构化特征（不存原始照片），支持随时关闭并立即停止采集。<br>1.0 版本默认关闭，2.0 摄像头方案启用。</div>
    <div style="margin-top:12px"><button class="btn pri" onclick="saveSafety()">保存</button></div></div>`;
  }else if(sysTab==='school'){
    const sc=S.settings.school;
    body=`<div class="bd">
      <div class="field"><label>学校名称</label><input id="s-name" value="${esc(sc.name)}" style="width:320px;padding:8px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      <div class="field"><label>校区</label><input id="s-campus" value="${esc(sc.campuses.join('、'))}" style="width:320px;padding:8px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      <div class="field"><label>年级班级结构（顿号分隔）</label><input id="s-grades" value="${esc(sc.grades.join('、'))}" style="width:560px;padding:8px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      <div style="font-size:12.5px;color:var(--mut)">年级班级结构是「数据范围权限」和「班主任推送」的基础数据</div>
      <div style="margin-top:12px"><button class="btn pri" onclick="saveSchool()">保存</button></div></div>`;
  }else if(sysTab==='dict'){
    const devs=S.devices;
    const grades=S.settings.school.grades;
    const rows=devs.map(d=>{
      const opts=grades.map(g=>`<option ${g===d.cls?'selected':''}>${g}</option>`).join('');
      return `<tr><td>${d.id}</td><td>${esc(d.loc)}</td><td>${d.zone||'—'}</td><td><select data-dev="${d.id}" style="padding:4px 6px;border:1px solid var(--line);border-radius:var(--radius)"><option value="">未关联</option>${opts}</select></td></tr>`;
    }).join('');
    body=`<table class="list"><thead><tr><th>设备编号</th><th>安装位置</th><th>区域/楼栋</th><th>关联班级（数据范围依据）</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="padding:12px 16px"><button class="btn pri" onclick="saveDict()">保存映射</button></div>
    <div class="demo-note">点位→区域→班级映射决定：班主任数据范围、班主任确认推送对象；区域按楼栋自动归组</div>`;
  }else if(sysTab==='retain'){
    body=`<div class="bd"><div class="field"><label>取证文件保留期（天）</label><input id="r-retain" type="number" value="${S.settings.retainDays}" style="width:160px;padding:8px;border:1px solid var(--line);border-radius:var(--radius)"></div>
    <div style="font-size:12.5px;color:var(--mut)">默认 30 天，每日凌晨自动清理过期取证文件，清理动作写入审计日志</div>
    <div style="margin-top:12px"><button class="btn pri" onclick="saveRetain()">保存</button></div></div>`;
  }else{
    body=`<div class="bd"><div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px">
      <input type="checkbox" id="skipT" ${S.settings.skipTeacher?'checked':''} style="width:18px;height:18px;accent-color:var(--primary)"> 班主任确认环节（默认跳过）</label></div>
    <div style="font-size:12.5px;color:var(--mut)">开启 = 处置结果提交后直接进入「德育处审核」；关闭 = 先经「班主任确认」再审核</div>
    <div style="margin-top:12px"><button class="btn pri" onclick="toggleSkip()">保存</button></div></div>`;
  }
  return `<div class="card"><div class="hd" style="padding:0"><div class="tabs" style="border:none;width:100%">${tabs}</div></div><div class="bd" style="padding:0">${body}</div></div>`;
}
function bindSys(){
  document.querySelectorAll('#content .tabs button').forEach(b=>b.addEventListener('click',()=>{sysTab=b.dataset.t;renderPage('sys')}));
}
function saveRules(){
  const getT=(lv)=>[...document.querySelectorAll(`#content input[data-lv="${lv}"][data-t]:checked`)].map(c=>c.dataset.t);
  const num=(id,def)=>{const v=parseInt($(id).value,10);return isNaN(v)||v<=0?def:v};
  S.settings.rules={
    l1:{types:getT('l1'),stayMin:num('r-stay',3),gatherN:num('r-gather',3)},
    l2:{types:getT('l2'),confMin:num('r-conf2',75),escalateMin:num('r-escalate',10)},
    l3:{types:getT('l3'),confMin:num('r-conf3',80)},
    dedupMin:num('r-dedup',5)
  };
  save();logPush('修改告警规则');
  toast('告警规则已保存（分级判定/限时处置/去重窗口已生效）','ok');
}
function saveRetain(){
  const v=parseInt($('r-retain').value,10);
  S.settings.retainDays=isNaN(v)||v<1?30:v;save();
  logPush('修改取证保留期：'+S.settings.retainDays+' 天');
  toast('取证保留期已保存：'+S.settings.retainDays+' 天（次日凌晨生效）','ok');
}
function toggleSkip(){
  S.settings.skipTeacher=!S.settings.skipTeacher;save();
  logPush('修改审批流配置（班主任确认'+(S.settings.skipTeacher?'跳过':'启用')+'）');
  toast('班主任确认环节已'+(S.settings.skipTeacher?'配置跳过（处置后直接进德育处审核）':'启用（需班主任确认）'),'ok');
  renderPage('sys');
}
function saveTemplates(){
  ['wechat','sms','confirm'].forEach(k=>{
    const el=$('tp-'+k);
    if(el)S.settings.templates[k]=el.value;
  });
  save();logPush('修改消息模板');
  toast('消息模板已保存','ok');
}
function saveSafety(){
  S.settings.safety.face=$('s-face').checked;save();
  logPush('修改数据安全开关（人脸功能'+(S.settings.safety.face?'开启':'关闭')+'）');
  toast('数据安全设置已保存：人脸功能'+(S.settings.safety.face?'开启':'关闭'),'ok');
}
function saveSchool(){
  S.settings.school.name=$('s-name').value||'未命名学校';
  S.settings.school.campuses=$('s-campus').value.split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
  S.settings.school.grades=$('s-grades').value.split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
  save();logPush('修改学校信息');
  toast('学校信息已保存','ok');
}
function saveDict(){
  document.querySelectorAll('#content select[data-dev]').forEach(sel=>{
    const d=S.devices.find(x=>x.id===sel.dataset.dev);
    if(d)d.cls=sel.value;
  });
  save();logPush('修改区域点位字典');
  toast('点位映射已保存','ok');
}
function savePushCfg(){
  const push={};
  [1,2,3].forEach(lv=>{
    push['l'+lv]=[...document.querySelectorAll(`#content input[data-lv="${lv}"]:checked`)].map(c=>c.dataset.ch);
  });
  S.settings.push=push;save();
  logPush('修改推送配置');
  toast('推送设置已保存','ok');
}

/* ---- 权限管理（角色 + 账号 合并页） ---- */
let permTab='roles';
function pgPerm(){
  const tabs=[['roles','角色管理'],['accounts','账号管理']].map(t=>`<button class="${permTab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  return `<div class="card" style="margin-bottom:14px"><div class="hd" style="padding:0"><div class="tabs" style="border:none;width:100%">${tabs}</div></div></div>`+(permTab==='roles'?pgRoles():pgAccounts());
}
function bindPerm(){
  document.querySelectorAll('#content .tabs button').forEach(b=>b.addEventListener('click',()=>{permTab=b.dataset.t;renderPage('perm')}));
  if(permTab==='roles')bindRoles();
}

/* ---- 角色/账号（可配置版） ---- */
let roleSel='guard';
let permDirty=false;
function pgRoles(){
  const sel=S.roles.find(r=>r.id===roleSel)||S.roles[0];
  roleSel=sel.id;permDirty=false;
  const locked=sel.id==='admin';
  const menuTree=MENU_ITEMS.map(([k,n])=>{
    const on=sel.perms.menu.includes(k);
    return `<label><input type="checkbox" data-cat="menu" data-k="${k}" ${on?'checked':''} ${locked?'disabled':''}> ${n}</label>`;
  }).join('');
  const btnTree=BTN_ITEMS.map(([k,n])=>{
    const on=sel.perms.btns.includes(k);
    return `<label><input type="checkbox" data-cat="btns" data-k="${k}" ${on?'checked':''} ${locked?'disabled':''}> ${n}</label>`;
  }).join('');
  return `<div class="grid3">
    <div class="card"><div class="hd">角色列表<span class="tag">${S.roles.length}</span><div class="sp"></div><button class="btn sm pri" onclick="openRoleModal()">+ 新建角色</button></div>
      <div class="bd" style="padding:8px">
      ${S.roles.map(r=>`<div style="padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;${roleSel===r.id?'background:var(--primary-bg);border-color:#c9dcf2':''}" onclick="roleSel='${r.id}';renderPage('perm')">
        <b style="font-size:13px">${esc(r.name)}</b>${r.builtin?'<span class="tag">内置</span>':''}<div style="font-size:11.5px;color:var(--mut)">${esc(r.desc)}</div></div>`).join('')}
      </div></div>
    <div class="card"><div class="hd">功能权限 · ${esc(sel.name)}
      ${locked?'<span class="tag" style="color:var(--danger);background:#fbe4e1">内置超管锁定不可改</span>':''}
      <div class="sp"></div><button class="btn sm pri" id="perm-save" ${locked?'disabled':''} onclick="savePerms()">保存权限</button></div>
      <div class="bd"><div class="ptree">
        <div class="grp">菜单权限</div>${menuTree}
        <div class="grp">按钮权限</div>${btnTree}
      </div>
      <div class="demo-note">修改后点「保存权限」生效；自定义角色可在此勾选菜单与按钮权限</div></div></div>
  </div>`;
}
function bindRoles(){
  document.querySelectorAll('#content .ptree input[type=checkbox]:not(:disabled)').forEach(c=>{
    c.addEventListener('change',()=>{
      permDirty=true;
      const b=$('perm-save');if(b){b.style.outline='2px solid var(--warn)';b.textContent='保存权限（有未保存修改）'}
    });
  });
}
function savePerms(){
  const sel=S.roles.find(r=>r.id===roleSel);
  if(!sel||sel.id==='admin')return;
  sel.perms.menu=[...document.querySelectorAll('#content .ptree input[data-cat="menu"]:checked')].map(c=>c.dataset.k);
  sel.perms.btns=[...document.querySelectorAll('#content .ptree input[data-cat="btns"]:checked')].map(c=>c.dataset.k);
  save();permDirty=false;logPush('修改角色权限：'+sel.name);
  const b=$('perm-save');if(b){b.style.outline='none';b.textContent='保存权限'}
  toast('权限已保存：'+sel.name,'ok');
}
function openRoleModal(){
  $('modal-root').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="hd">新建角色</div><div class="bd">
      <div class="field"><label>角色名称（必填）</label><input id="nr-name" placeholder="如：宿管组" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>
      <div class="field"><label>角色描述</label><input id="nr-desc" placeholder="如：负责宿舍区域巡查与告警处置" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>
    </div><div class="ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="createRole()">创建</button></div></div></div>`;
}
function createRole(){
  const name=$('nr-name').value.trim();
  if(!name){toast('请填写角色名称','err');return}
  const id='r'+Date.now().toString(36);
  S.roles.push({id,name,desc:$('nr-desc').value.trim()||'自定义角色',builtin:false,perms:{menu:['dashboard','workbench'],btns:[]}});
  save();closeModal();roleSel=id;logPush('创建角色：'+name);renderPage('perm');
  toast('角色已创建：'+name+'（可在右侧配置权限）','ok');
}
function pgAccounts(){
  const rows=S.accounts;
  const roleOpts=S.roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
  return `<div class="card"><div class="hd">账号管理<span class="tag">${rows.length} 个账号</span><div class="sp"></div>
    <button class="btn pri sm" onclick="openAccModal()">+ 新建账号</button></div>
    <div class="filters"><input id="acc-q" placeholder="姓名/账号模糊查询" oninput="filterAcc()">
      <select id="acc-f-role" onchange="filterAcc()"><option value="">全部角色</option>${roleOpts}</select>
      <select id="acc-f-status" onchange="filterAcc()"><option value="">全部状态</option><option value="on">启用</option><option value="off">禁用</option></select></div>
    <table class="list"><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>手机号</th><th>负责区域/班级</th><th>最近登录</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="acc-tbody">${accRows(rows)}</tbody></table></div>`;
}
function accRows(rows){
  return rows.map(a=>`<tr data-user="${esc(a.user)}">
    <td class="mono">${esc(a.user)}</td><td>${esc(a.name)}</td><td>${esc(roleName(a.role))}</td>
    <td>${esc(a.phone)}</td><td>${esc(a.scope)}</td><td>${esc(a.last||'—')}</td>
    <td>${a.status==='on'?'<span class="badge b-on">启用</span>':'<span class="badge b-off">禁用</span>'}</td>
    <td><a href="javascript:void 0" onclick="openAccModal('${esc(a.user)}')">编辑</a>
        <span style="color:var(--line)">|</span>
        <a href="javascript:void 0" onclick="toggleAcc('${esc(a.user)}')">${a.status==='on'?'禁用':'启用'}</a></td></tr>`).join('');
}
function filterAcc(){
  const q=($('acc-q').value||'').trim().toLowerCase();
  const fr=$('acc-f-role').value, fs=$('acc-f-status').value;
  const list=S.accounts.filter(a=>
    (!q||a.user.toLowerCase().includes(q)||a.name.toLowerCase().includes(q)) &&
    (!fr||a.role===fr) && (!fs||a.status===fs));
  $('acc-tbody').innerHTML=accRows(list);
}
function openAccModal(user){
  const a=user?S.accounts.find(x=>x.user===user):null;
  const roleOpts=S.roles.map(r=>`<option value="${r.id}" ${(a?a.role==r.id:r.id==='guard')?'selected':''}>${esc(r.name)}</option>`).join('');
  $('modal-root').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="hd">${a?'编辑账号':'新建账号'}</div><div class="bd">
      <div class="field"><label>登录账号${a?'（不可修改）':'（必填）'}</label><input id="ac-user" value="${a?esc(a.user):''}" ${a?'disabled':''} style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius)"></div>

function saveAcc(user){
  const name=$('ac-name').value.trim();
  if(!name){toast('请填写姓名','err');return}
  if(user){
    const a=S.accounts.find(x=>x.user===user);
    a.name=name;a.phone=$('ac-phone').value.trim();a.role=$('ac-role').value;a.scope=$('ac-scope').value.trim();
    save();closeModal();renderPage('perm');logPush('更新账号：'+user);toast('账号已更新：'+a.user,'ok');
  }else{
    const u=$('ac-user').value.trim();
    if(!u){toast('请填写登录账号','err');return}
    if(S.accounts.some(x=>x.user===u)){toast('账号已存在：'+u,'err');return}
    S.accounts.push({user:u,name,role:$('ac-role').value,phone:$('ac-phone').value.trim(),scope:$('ac-scope').value.trim(),last:'—',status:'on'});
    save();closeModal();renderPage('perm');logPush('创建账号：'+u);toast('账号已创建：'+u+'（默认密码 123456）','ok');
  }
}
function toggleAcc(user){
  const a=S.accounts.find(x=>x.user===user);
  a.status=a.status==='on'?'off':'on';
  save();renderPage('perm');
  logPush((a.status==='on'?'启用':'禁用')+'账号：'+user);
  toast((a.status==='on'?'已启用':'已禁用')+'：'+user,'ok');
}

/* ---- 通知中心 ---- */
function renderBell(){
  const n=pendingCount();
  const dot=$('bell-dot');
  dot.hidden=n===0;dot.textContent=n>99?'99+':n;
}
function toggleNotif(){
  const old=document.querySelector('.notif-panel');
  if(old){old.remove();return}
  const items=[];
  S.orders.filter(o=>o.state==='pending').forEach(o=>items.push([o,o.escalated?'超时未处置，已升级':'新告警未处置']));
  S.orders.filter(o=>o.state==='handling').forEach(o=>items.push([o,'处置中']));
  if(S.role==='teacher')S.orders.filter(o=>o.state==='teacher_confirm').forEach(o=>items.push([o,'待您确认']));
  if(S.role==='dean')S.orders.filter(o=>o.state==='dean_review').forEach(o=>items.push([o,'待您审核']));
  const html=items.map(([o,m])=>`<div class="it" onclick="location.hash='#/order/${o.id}';document.querySelector('.notif-panel')?.remove()">
    <span class="badge b-l${o.level}">${LEVELS[o.level].n}</span><div><div class="t">${esc(o.type)} · ${esc(o.loc)}</div><div class="m">${esc(o.id)} · ${m}</div></div></div>`).join('');
  const panel=document.createElement('div');
  panel.className='notif-panel';
  panel.style.position='fixed';
  const bell=$('bell').getBoundingClientRect();
  panel.style.top=(bell.bottom+8)+'px';
  panel.style.right=(window.innerWidth-bell.right)+'px';
  panel.innerHTML=`<div class="hd">通知中心<span>${items.length} 条</span></div>${html||'<div class="empty" style="padding:24px">暂无通知</div>'}<div style="padding:8px 14px;border-top:1px solid var(--line);text-align:center"><a href="javascript:void 0" onclick="document.querySelector('.notif-panel')?.remove();location.hash='#/notifs'" style="font-size:12px;color:var(--primary)">查看全部通知 →</a></div>`;
  document.body.appendChild(panel);
}

let notifTab='all';
function notifList(){
  const list=[];
  S.orders.forEach(o=>{
    if(o.state==='pending'||o.state==='handling')list.push({id:'n'+o.id,type:'alert',title:(o.state==='pending'?'未处置告警':'处置中')+' · '+o.type+'（'+LEVELS[o.level].n+'）',time:o.time,ref:o.id,read:!!S.notifRead[o.id]});
  });
  [['sys1','系统','每日 02:00 数据备份任务执行成功','08-12 02:00'],
   ['sys2','系统','取证清理任务完成，清理 12 条过期记录','08-11 02:00'],
   ['sys3','工单','工单 WO20260812002 已自动升级（超时未接单）','08-12 14:18']].forEach(s=>{
    if(!list.find(x=>x.id===s[0]))list.push({id:s[0],type:s[1]==='系统'?'sys':'work',title:s[2],time:s[3],read:!!S.notifRead[s[0]]});
  });
  return list;
}
function pgNotifs(){
  const all=notifList();
  const tabs=[['all','全部'],['unread','未读'],['alert','告警'],['work','工单'],['sys','系统']].map(t=>`<button class="${notifTab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}${t[0]==='unread'&&all.filter(n=>!n.read).length?`（${all.filter(n=>!n.read).length}）`:''}</button>`).join('');
  const list=all.filter(n=>notifTab==='all'?true:notifTab==='unread'?!n.read:n.type===notifTab);
  const rows=list.map(n=>`<tr style="cursor:pointer" onclick="openNotif('${n.id}')">
    <td>${n.read?'':'<span class="dot" style="display:inline-block;width:7px;height:7px;background:var(--danger);border-radius:50%;margin-right:6px"></span>'}<span class="badge ${n.type==='alert'?'b-l3':n.type==='work'?'b-confirm':'b-archived'}">${n.type==='alert'?'告警':n.type==='work'?'工单':'系统'}</span></td>
    <td>${esc(n.title)}</td><td style="color:var(--mut)">${n.time}</td><td>${n.read?'<span style="color:var(--mut)">已读</span>':'<b style="color:var(--danger)">未读</b>'}</td></tr>`).join('');
  return `<div class="card"><div class="hd" style="padding:0"><div class="tabs" style="border:none;width:100%">${tabs}</div></div>
    <table class="list"><thead><tr><th style="width:90px">类型</th><th>内容</th><th style="width:150px">时间</th><th style="width:70px">状态</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="4" style="text-align:center;color:var(--mut);padding:30px">暂无通知</td></tr>'}</tbody></table>
    <div class="demo-note">站内通知全量留痕（与微信推送互补：站内全量、微信仅二级以上）；点击跳转对应工单</div></div>`;
}
function bindNotifs(){
  document.querySelectorAll('#content .tabs button').forEach(b=>b.addEventListener('click',()=>{notifTab=b.dataset.t;renderPage('notifs')}));
}
function openNotif(id){
  S.notifRead[id]=true;save();

  if(n&&n.ref)location.hash='#/order/'+n.ref;
  else renderPage('notifs');
}

let curPageKey='';
function showTip(ev,text){
  hideTip();
  const t=document.createElement('div');
  t.className='tipbox';
  t.textContent=text;
  document.body.appendChild(t);
  const r=ev.currentTarget.getBoundingClientRect();
  const tr=t.getBoundingClientRect();
  let x=Math.round(r.left+r.width/2-tr.width/2);
  x=Math.max(8,Math.min(x,window.innerWidth-tr.width-8));
  let y=r.top-tr.height-8;
  if(y<8)y=r.bottom+8;   // 上方放不下 → 翻转到下方
  t.style.left=x+'px';
  t.style.top=y+'px';
  window.__tip=t;
}
function hideTip(){if(window.__tip){window.__tip.remove();window.__tip=null}}
function injectHints(pageKey){
  if(!S.settings.annot)return;
  (HINTS[pageKey]||[]).forEach(h=>{
    document.querySelectorAll(h.sel).forEach(el=>{
      const dup=el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA'
        ?(el.nextElementSibling&&el.nextElementSibling.classList.contains('hint'))
        :el.querySelector(':scope > .hint');
      if(dup)return;
      const s=document.createElement('span');
      s.className='hint';
      s.textContent='ⓘ';
      s.addEventListener('mouseenter',e=>showTip(e,h.tip));
      s.addEventListener('mouseleave',hideTip);
      if(el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA'){
        el.insertAdjacentElement('afterend',s);
      }else{
        el.appendChild(s);
      }
    });
  });
}
function exportAnnot(){
  const lines=['# 微澜守护 · 校园防霸凌预警系统 1.0 · 功能逻辑标注清单',''];
  Object.keys(ANNOTATIONS).forEach(k=>{
    const name=k==='order'?'工单详情':(MENU_META[k]?MENU_META[k].n:k);
    lines.push('## '+name);
    ANNOTATIONS[k].forEach((a,i)=>lines.push((i+1)+'. **'+a.t+'**：'+a.b));
    lines.push('');
  });
  const blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='微澜守护-逻辑标注清单.md';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('标注清单已导出（Markdown）','ok');
}
function setAnnot(on){
  S.settings.annot=!!on;save();applyAnnot();route();
  toast(on?'已开启评审标注（面板+ⓘ提示）':'已关闭标注（演示模式）','ok');
}
function applyAnnot(){
  document.body.classList.toggle('annot-on',!!S.settings.annot);
  const b=$('annot-btn');if(b)b.classList.toggle('on',!!S.settings.annot);
}
function fmtAnnot(txt){return txt.split(/(?=\d+、)/).map(s=>`<div class="li">${s}</div>`).join('')}
function renderAnnot(pageKey){
  applyAnnot();
  if(!S.settings.annot)return;
  const list=ANNOTATIONS[pageKey]||[];
  const pageName=pageKey==='order'?'工单详情':(MENU_META[pageKey]?MENU_META[pageKey].n:pageKey);
  $('annot-title').textContent='逻辑标注 · '+pageName;
  $('annot-count').textContent=list.length+' 条';
  $('annot-body').innerHTML=list.length
    ?list.map((a,i)=>`<div class="annot-item"><div class="t"><span class="n">${ANNOT_NUMS[i]||(i+1)}</span>${a.tag?`<span class="atag atag-${a.tag}">${a.tag==='op'?'操作':a.tag==='jump'?'跳转':a.tag==='field'?'字段':'规则'}</span>`:''}${a.t}</div><div class="b">${fmtAnnot(a.b)}</div></div>`).join('')
    :'<div class="annot-item"><div class="b">本页暂无标注</div></div>';
}
