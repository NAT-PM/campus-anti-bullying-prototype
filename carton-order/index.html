<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新丰达纸板 · 在线下单系统演示</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#EEF2F7;color:#1F2937}
  header{height:58px;background:#1E4E8C;color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;flex-wrap:wrap}
  .brand{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  nav{display:flex;gap:8px}
  nav button{height:34px;padding:0 14px;border:1px solid rgba(255,255,255,.35);border-radius:8px;background:transparent;color:#fff;font:inherit;font-size:13px;cursor:pointer}
  nav button.on{background:#fff;color:#1E4E8C;border-color:#fff;font-weight:700}
  .note{margin-left:auto;font-size:11.5px;color:rgba(255,255,255,.75)}
  .frame{height:calc(100vh - 58px);width:100%}
  iframe{width:100%;height:100%;border:0;background:#EEF2F7;display:block}
  @media(max-width:720px){
    header{height:auto;padding:10px 12px;gap:8px}
    .brand{width:100%;font-size:14px}
    .note{display:none}
    nav button{height:32px;padding:0 10px;font-size:12px}
    .frame{height:calc(100vh - 96px)}
  }
</style>
</head>
<body>
<header>
  <div class="brand">新丰达纸板 · 在线下单系统</div>
  <nav>
    <button class="on" data-src="client.html">客户端（小程序）</button>
    <button data-src="admin.html?view=admin">管理后台</button>
    <button data-src="admin.html?view=verify">算法验证</button>
  </nav>
  <div class="note">演示数据：客户、订单、价格均为虚构，非真实客户</div>
</header>
<div class="frame"><iframe id="f" src="client.html" title="原型演示"></iframe></div>
<script>
  var f = document.getElementById('f');
  var btns = document.querySelectorAll('nav button');
  btns.forEach(function (b) {
    b.onclick = function () {
      btns.forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      f.src = b.getAttribute('data-src');
    };
  });
  f.onload = function () {
    try {
      var d = f.contentDocument;
      if (!d.getElementById('embed-hide')) {
        var st = d.createElement('style');
        st.id = 'embed-hide';
        st.textContent = '.toolbar{display:none!important}';
        d.head.appendChild(st);
      }
    } catch (e) {}
  };
</script>
</body>
</html>
